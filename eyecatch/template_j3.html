<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new.css">
<style>
/* J-3：モダン太枠（1280×670） */
:root{--bg:#ffffff;--ink:#141517;--sub:#6e7278;--accent:#e2483d;--mark:#ffd9d4}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.frame{position:absolute;inset:28px;border:6px solid var(--ink)}
.mast{position:absolute;top:28px;left:28px;right:28px;height:86px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.mast .name{font-size:34px;font-weight:900;letter-spacing:.14em}
.mast .no{font-size:20px;font-weight:900;letter-spacing:.2em}
.mast .no b{font-size:36px;color:var(--accent);margin-left:6px}
.main{position:absolute;top:114px;bottom:86px;left:28px;right:28px;display:grid;place-items:center;align-content:center;gap:24px}
.kicker{font-size:22px;font-weight:900;letter-spacing:.24em;color:#fff;background:var(--accent);padding:4px 18px}
h1{font-size:72px;font-weight:900;line-height:1.38;text-align:center;letter-spacing:.02em}
h1 em{font-style:normal;background:linear-gradient(transparent 55%,var(--mark) 55%)}
.foot{position:absolute;bottom:34px;left:34px;right:34px;height:52px;border-top:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:40px;font-size:18px;font-weight:700;letter-spacing:.18em;color:var(--sub)}
</style></head><body>
<div class="frame"></div>
<div class="mast"><span class="name">AIチャレンジ365</span><span class="no">No.<b>10</b></span></div>
<div class="main">
  <div class="kicker">特集 ／ LINEスタンプ</div>
  <h1>フォロワーがいなくても、<br>スタンプは<em>売れる？</em></h1>
</div>
<div class="foot"><span>人気スタンプの共通点</span><span>・</span><span>調べてみた</span></div>
</body></html>
