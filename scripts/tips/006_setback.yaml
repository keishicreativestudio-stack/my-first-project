type: tips
episode: 7
hook: "買った土地に\n*使えない部分*が\nあるかも？"
sub: "「セットバック」の話"
points:
  - title: "細い道路に注意"
    body: "幅*4m未満*の道路に\n面した土地は要注意"
  - title: "セットバック"
    body: "道路の中心から*2m*\n下がった所までしか\n建物や塀をつくれない"
  - title: "確認方法"
    body: "図面の*「セットバック要」*\nの表記と、下がった後の\n面積をチェック"
conclusion: "土地は\n*使える面積*で比べよう"
caption: |
  前の道路が狭い土地は「セットバック」で使える面積が減ることがあります。
  図面の表記をチェックしましょう📐
hashtags: [セットバック, 土地探し, 家探し, 注文住宅, 不動産, 家を買う前に]
