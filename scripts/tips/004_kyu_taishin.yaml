type: tips
episode: 5
hook: "中古の家は\n築年数より\n*この日付*を見て"
sub: "耐震基準の分かれ目があります"
points:
  - title: "1981年6月1日"
    body: "この日以降に\n*建築確認*を受けた建物が\n「新耐震基準」"
  - title: "注意ポイント"
    body: "完成日ではなく\n*建築確認日*で判断\n1981〜83年築は要確認"
  - title: "木造なら"
    body: "*2000年6月*以降は\n基準がさらに強化\n(いわゆる2000年基準)"
conclusion: "旧耐震かどうかは\n*税制やローン*にも影響"
caption: |
  中古住宅は「いつ建築確認を受けたか」で耐震基準が変わります。
  1981年6月1日がひとつの分かれ目。気になる物件は担当者に確認しましょう。
hashtags: [耐震基準, 旧耐震, 中古戸建, 家探し, 不動産, 家を買う前に]
