<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new.css">
<style>
/* K案：調査レポート風（1280×670） */
:root{--bg:#f6f8fa;--ink:#1e2833;--sub:#7a8694;--bar:#d5dde6;--accent:#2e7dd7;--grid:#e3e8ee}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.main{position:absolute;inset:0;display:grid;justify-items:center;align-content:center;gap:24px}
.series{font-size:20px;font-weight:900;letter-spacing:.26em;color:var(--sub)}
.series b{color:var(--accent)}
h1{font-size:68px;font-weight:900;line-height:1.35;text-align:center;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--accent)}
.chart{margin-top:14px;width:560px;display:flex;align-items:flex-end;gap:14px;height:120px;border-bottom:2px solid var(--ink);padding:0 10px;position:relative}
.chart i{flex:1;background:var(--bar);border-radius:6px 6px 0 0}
.chart i.hit{background:var(--accent)}
.chart .lab{position:absolute;right:-6px;top:-34px;font-size:18px;font-weight:900;color:var(--accent);letter-spacing:.06em}
.cap{font-size:20px;font-weight:500;color:var(--sub);letter-spacing:.1em}
</style></head><body>
<div class="main">
  <div class="series">AIチャレンジ365 ｜ <b>DAY 10</b></div>
  <h1>フォロワーなしでも、<br><em>スタンプは売れる？</em></h1>
  <div class="chart">
    <i style="height:38%"></i><i style="height:55%"></i><i style="height:30%"></i><i style="height:70%"></i><i style="height:48%"></i><i style="height:62%"></i><i class="hit" style="height:100%"></i>
    <span class="lab">↑ 共通点を調査</span>
  </div>
  <div class="cap">人気LINEスタンプを調べてみた</div>
</div>
</body></html>
