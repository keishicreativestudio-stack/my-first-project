<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- APP START -->
<title>間取りメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ink: #1f2a37;
  --ink-soft: #5a6878;
  --line: #d5dde6;
  --chrome: #eef2f6;
  --panel: #f8fafc;
  --paper: #ffffff;
  --field: #ffffff;
  --accent: #2b4c7e;
  --accent-soft: #dbe5f3;
  --danger: #b4322a;
  --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: #e4e9ef; --ink-soft: #9aa7b5; --line: #334150; --chrome: #17202a; --field: #17202a;
    --panel: #1d2733; --accent: #8fb0e0; --accent-soft: #28384d; --danger: #f08a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e4e9ef; --ink-soft: #9aa7b5; --line: #334150; --chrome: #17202a; --field: #17202a;
  --panel: #1d2733; --accent: #8fb0e0; --accent-soft: #28384d; --danger: #f08a80;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--chrome); color: var(--ink);
  font-family: var(--sans); font-size: 14px; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app {
  height: 100%; display: grid;
  grid-template-columns: 200px 1fr 232px;
  grid-template-rows: auto 1fr;
  grid-template-areas: "top top top" "pal stage props";
}
.top {
  grid-area: top; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 700; font-size: 16px; letter-spacing: .04em; margin-right: 8px; white-space: nowrap; }
.brand small { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.tools { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.btn {
  border: 1px solid var(--line); background: var(--field); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; white-space: nowrap; line-height: 1.3;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.danger { color: var(--danger); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 500; }
.total {
  margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.total b { color: var(--ink); font-size: 14px; font-weight: 500; }
select.btn { padding-right: 4px; }

.palette {
  grid-area: pal; overflow-y: auto; padding: 14px; background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px;
}
.palette h3 { margin: 0 0 6px; font-size: 11px; font-weight: 500; letter-spacing: .12em; color: var(--ink-soft); }
.addform { display: flex; flex-direction: column; gap: 8px; }
.sizebox { display: flex; align-items: center; gap: 4px; }
.sizebox input {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px;
  background: var(--field); font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums;
}
.sizebox input.bad { border-color: var(--danger); }
.sizebox span { font-size: 12px; color: var(--ink-soft); }
.note { font-size: 11px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 2px 9px;
  font-family: var(--mono); font-size: 12px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }

.stage { grid-area: stage; position: relative; overflow: hidden; background: var(--paper); }
#canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#canvas.panning { cursor: grabbing; }
#shapes *, #selection *, #guides * { vector-effect: non-scaling-stroke; }
.shape { cursor: move; }
.zoombox {
  position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center;
  font-family: var(--mono); font-size: 11px; color: #5a6878;
}
.zoombox .btn { background: #fff; color: #1f2a37; border-color: #d5dde6; padding: 3px 9px; }
.hint {
  position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: #5a6878;
  background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 4px; max-width: calc(100% - 180px);
}

.props {
  grid-area: props; overflow-y: auto; padding: 14px; background: var(--panel);
  border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px;
}
.props h2 { margin: 0; font-size: 15px; }
.props .empty { color: var(--ink-soft); font-size: 13px; line-height: 1.7; margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; letter-spacing: .08em; color: var(--ink-soft); }
.field input[type="text"], .field input[type="number"] {
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--field); width: 100%; min-width: 0;
}
.field input.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.field input.bad { border-color: var(--danger); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.area {
  font-family: var(--mono); font-variant-numeric: tabular-nums; background: var(--accent-soft);
  border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: baseline;
}
.area b { font-size: 18px; font-weight: 500; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.keys { font-size: 11px; color: var(--ink-soft); line-height: 1.8; margin-top: auto; }
.keys kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 10px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.toast {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #1f2a37; color: #fff;
  padding: 6px 14px; border-radius: 6px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

@media (max-width: 820px) {
  .app {
    grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto;
    grid-template-areas: "top" "stage" "props" "pal";
  }
  .brand small, .hint, .palette .note { display: none; }
  .palette {
    border-right: 0; border-top: 1px solid var(--line); padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); gap: 8px;
  }
  .palette h3 { display: none; }
  .addform { flex-direction: row; }
  .chips { flex-wrap: nowrap; overflow-x: auto; }
  .props { border-left: 0; border-top: 1px solid var(--line); max-height: 38vh; padding: 10px 16px; }
  .props.none { display: none; }
  .keys { display: none; }
  .total { margin-left: 0; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">間取りメーカー<small>単位 mm</small></div>
    <div class="tools">
      <button class="btn" id="undo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
      <button class="btn" id="redo" title="やり直し (Ctrl+Y)">↷ やり直し</button>
      <span class="sep"></span>
      <select class="btn" id="gridSel" title="ドラッグ時のスナップ間隔">
        <option value="1" selected>吸着 1mm</option>
        <option value="10">吸着 10mm</option>
        <option value="100">吸着 100mm</option>
        <option value="455">吸着 455mm</option>
        <option value="910">吸着 910mm</option>
      </select>
      <label class="check btn" title="ほかの四角の辺にぴったり吸着させる"><input type="checkbox" id="magnet" checked>辺に吸着</label>
      <span class="sep"></span>
      <button class="btn" id="fit">全体表示</button>
      <button class="btn" id="png">PNG保存</button>
      <button class="btn" id="save">JSON保存</button>
      <button class="btn" id="load">読込</button>
      <button class="btn danger" id="clear">全消去</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <div class="total">合計 <b id="totalM2">0.00</b> ㎡ ／ <b id="totalJo">0.0</b> 帖 ／ <b id="totalTsubo">0.00</b> 坪</div>
  </header>

  <aside class="palette" id="palette" aria-label="四角を追加">
    <div>
      <h3>四角を追加</h3>
      <form class="addform" id="addForm">
        <div class="sizebox">
          <input type="text" id="newSize" value="324×465" inputmode="numeric" autocomplete="off" aria-label="幅×奥行（mm）">
          <span>mm</span>
        </div>
        <button class="btn primary" type="submit">追加</button>
      </form>
    </div>
    <p class="note">「幅×奥行」を1mm単位で入力。<br>324×465、324x465、324 465 のどれでもOK。<br>四角を選んでから追加すると、その右隣にぴったり並べます。</p>
    <div>
      <h3>最近のサイズ</h3>
      <div class="chips" id="chips"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="world">
        <path id="gridMinor" fill="none" stroke="#e8eff5" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <path id="gridMajor" fill="none" stroke="#cad8e5" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <g id="shapes"></g>
        <g id="labels"></g>
        <g id="guides"></g>
        <g id="selection"></g>
      </g>
    </svg>
    <div class="hint">ドラッグで移動、四隅で伸縮。辺どうしが近づくと自動でぴったり合わさります。</div>
    <div class="zoombox">
      <button class="btn" id="zoomOut" aria-label="縮小">−</button>
      <span id="gridVal"></span>　<span id="zoomVal">100%</span>
      <button class="btn" id="zoomIn" aria-label="拡大">＋</button>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="props" id="props" aria-label="選択中の四角"></aside>
</div>

<script>
(() => {
'use strict';

const COLORS = ['#ffffff', '#f6ead3', '#fbe0c6', '#e2ecd2', '#d5e9f4', '#e9e2f2', '#f3dede', '#ebe7e0'];
const JO = 1.62;      // 1帖 = 1.62㎡（不動産表示の目安）
const TSUBO = 3.30579;
const MIN = 1;
const K = '#2a3440';
const STORE = 'madori-rects-v1';

// ---------- 状態 ----------
let shapes = [];      // { id, x, y, w, h, name, color }  単位 mm（整数）
let selId = null;
let seq = 1;
const view = { x: -1000, y: -1000, s: 0.1 };   // s = px / mm
const hist = { stack: [], idx: -1 };
let grid = 1;
let magnet = true;
let recent = ['324×465', '910×1820', '1820×1820', '3640×2730'];

const $ = id => document.getElementById(id);
const svg = $('canvas'), world = $('world');
const newId = () => 's' + (seq++) + Math.random().toString(36).slice(2, 6);
const byId = id => shapes.find(s => s.id === id);
const areaM2 = s => s.w * s.h / 1e6;
const esc = str => String(str).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sizeText = s => `${Math.round(s.w)}×${Math.round(s.h)}`;

// "324×465" / "324x465" / "324 465" / "３２４＊４６５" → [324, 465]
function parseSize(str) {
  const t = String(str).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
  const m = t.match(/^(\d+(?:\.\d+)?)\s*(?:[×xX*＊,、，]|\s)\s*(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const w = Math.round(+m[1]), h = Math.round(+m[2]);
  return w >= MIN && h >= MIN ? [w, h] : null;
}

// ---------- 履歴 ----------
function commit() {
  const snap = JSON.stringify(shapes);
  if (hist.stack[hist.idx] === snap) return;
  hist.stack = hist.stack.slice(0, hist.idx + 1);
  hist.stack.push(snap);
  if (hist.stack.length > 200) hist.stack.shift();
  hist.idx = hist.stack.length - 1;
  persist();
  updateHistBtns();
}
function restore(i) {
  hist.idx = i;
  shapes = JSON.parse(hist.stack[i]);
  if (!byId(selId)) selId = null;
  persist(); render(); renderProps(); updateHistBtns();
}
const undo = () => hist.idx > 0 && restore(hist.idx - 1);
const redo = () => hist.idx < hist.stack.length - 1 && restore(hist.idx + 1);
function updateHistBtns() {
  $('undo').disabled = hist.idx <= 0;
  $('redo').disabled = hist.idx >= hist.stack.length - 1;
}
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify({ shapes, recent })); } catch (e) { /* 保存不可の環境 */ }
}

// ---------- 描画 ----------
const shapeSVG = s => `<rect class="shape" data-id="${s.id}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" fill="${s.color || '#fff'}" stroke="${K}" stroke-width="2"/>`;
// 文字は画面上で同じ大きさ（scale = px/mm）。四角が小さすぎるときは省略
function labelSVG(s, scale = view.s) {
  const fs = 13 / scale;
  const need = (s.name ? 2.6 : 1.4) * fs;
  if (s.h < need || s.w < fs * Math.max(sizeText(s).length * .62, (s.name || '').length) + fs) return '';
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  const lines = [];
  if (s.name) lines.push(`<tspan x="${cx}" dy="0" font-weight="700">${esc(s.name)}</tspan>`);
  lines.push(`<tspan x="${cx}" dy="${lines.length ? fs * 1.25 : 0}" font-size="${fs * .92}" font-family="IBM Plex Mono, monospace" fill="#5a6878">${sizeText(s)}</tspan>`);
  const y0 = cy - (lines.length - 1) * fs * .62;
  return `<text x="${cx}" y="${y0}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#1f2a37" font-family="Zen Kaku Gothic New, Hiragino Sans, sans-serif" pointer-events="none">${lines.join('')}</text>`;
}

function render() {
  const r = svg.getBoundingClientRect();
  world.setAttribute('transform', `matrix(${view.s},0,0,${view.s},${-view.x * view.s},${-view.y * view.s})`);
  const x0 = view.x, y0 = view.y, x1 = view.x + r.width / view.s, y1 = view.y + r.height / view.s;
  const gridPath = step => {
    let d = '';
    for (let x = Math.floor(x0 / step) * step; x <= x1; x += step) d += `M${x},${y0}V${y1}`;
    for (let y = Math.floor(y0 / step) * step; y <= y1; y += step) d += `M${x0},${y}H${x1}`;
    return d;
  };
  // 拡大率に合わせてグリッド間隔を切り替え（細線が5px未満なら10倍に）
  let minor = 10;
  while (minor * view.s < 6) minor *= 10;
  $('gridMinor').setAttribute('d', gridPath(minor));
  $('gridMajor').setAttribute('d', gridPath(minor * 10));
  $('shapes').innerHTML = shapes.map(shapeSVG).join('');
  $('labels').innerHTML = shapes.map(s => labelSVG(s)).join('');
  $('gridVal').textContent = `1マス ${minor}mm`;
  renderSelection();
  $('zoomVal').textContent = Math.round(view.s / 0.1 * 100) + '%';
  updateTotal();
}

function renderSelection() {
  const s = byId(selId);
  const g = $('selection');
  if (!s) { g.innerHTML = ''; return; }
  const k = 1 / view.s, hs = 9 * k;
  let o = `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" fill="none" stroke="#2b4c7e" stroke-width="2" stroke-dasharray="5 3" pointer-events="none"/>`;
  const hx = [s.x, s.x + s.w / 2, s.x + s.w], hy = [s.y, s.y + s.h / 2, s.y + s.h];
  const dirs = [['nw', 0, 0], ['n', 1, 0], ['ne', 2, 0], ['e', 2, 1], ['se', 2, 2], ['s', 1, 2], ['sw', 0, 2], ['w', 0, 1]];
  const cur = { nw: 'nwse', se: 'nwse', ne: 'nesw', sw: 'nesw', n: 'ns', s: 'ns', e: 'ew', w: 'ew' };
  for (const [d, i, j] of dirs) {
    o += `<rect data-handle="${d}" x="${hx[i] - hs / 2}" y="${hy[j] - hs / 2}" width="${hs}" height="${hs}" fill="#fff" stroke="#2b4c7e" stroke-width="1.5" style="cursor:${cur[d]}-resize"/>`;
  }
  const fs = 12 * k;
  o += `<text x="${s.x + s.w / 2}" y="${s.y - 14 * k}" font-size="${fs}" text-anchor="middle" fill="#2b4c7e" font-family="IBM Plex Mono, monospace" pointer-events="none">${Math.round(s.w)}</text>`;
  o += `<text x="${s.x + s.w + 14 * k}" y="${s.y + s.h / 2}" font-size="${fs}" dominant-baseline="central" fill="#2b4c7e" font-family="IBM Plex Mono, monospace" pointer-events="none">${Math.round(s.h)}</text>`;
  g.innerHTML = o;
}

function showGuides(gx, gy) {
  const r = svg.getBoundingClientRect();
  let o = '';
  const y0 = view.y, y1 = view.y + r.height / view.s, x0 = view.x, x1 = view.x + r.width / view.s;
  if (gx != null) o += `<line x1="${gx}" y1="${y0}" x2="${gx}" y2="${y1}" stroke="#d2462f" stroke-width="1" stroke-dasharray="4 3"/>`;
  if (gy != null) o += `<line x1="${x0}" y1="${gy}" x2="${x1}" y2="${gy}" stroke="#d2462f" stroke-width="1" stroke-dasharray="4 3"/>`;
  $('guides').innerHTML = o;
}

// 合計面積（重なりは1回だけ数える）
function unionArea(rects) {
  if (!rects.length) return 0;
  const xs = [...new Set(rects.flatMap(r => [r.x, r.x + r.w]))].sort((a, b) => a - b);
  let total = 0;
  for (let i = 0; i < xs.length - 1; i++) {
    const a = xs[i], b = xs[i + 1];
    const iv = rects.filter(r => r.x <= a && r.x + r.w >= b).map(r => [r.y, r.y + r.h]).sort((p, q) => p[0] - q[0]);
    let len = 0, cs = 0, ce = -Infinity;
    for (const [s, e] of iv) {
      if (s > ce) { if (ce > cs) len += ce - cs; cs = s; ce = e; } else ce = Math.max(ce, e);
    }
    if (ce > cs) len += ce - cs;
    total += len * (b - a);
  }
  return total / 1e6;
}
function updateTotal() {
  const m2 = unionArea(shapes);
  $('totalM2').textContent = m2.toFixed(2);
  $('totalJo').textContent = (m2 / JO).toFixed(1);
  $('totalTsubo').textContent = (m2 / TSUBO).toFixed(2);
}

// ---------- 追加 ----------
function renderChips() {
  $('chips').innerHTML = recent.map(t => `<button class="chip" type="button" data-size="${t}">${t}</button>`).join('');
}
function remember(w, h) {
  const t = `${w}×${h}`;
  recent = [t, ...recent.filter(x => x !== t)].slice(0, 8);
  renderChips();
}
function addRect(w, h) {
  const r = svg.getBoundingClientRect();
  const sel = byId(selId);
  const s = { id: newId(), w, h, name: '', color: '#ffffff' };
  if (sel) {             // 選択中の四角の右隣・上端そろえ
    s.x = sel.x + sel.w; s.y = sel.y;
  } else {
    s.x = Math.round(view.x + r.width / 2 / view.s - w / 2);
    s.y = Math.round(view.y + r.height / 2 / view.s - h / 2);
  }
  shapes.push(s);
  selId = s.id;
  remember(w, h);
  commit(); render(); renderProps();
  // 画面外に出たら見える位置へ
  const vx1 = view.x + r.width / view.s, vy1 = view.y + r.height / view.s;
  if (s.x + s.w > vx1 || s.y + s.h > vy1 || s.x < view.x || s.y < view.y) fit();
}
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = parseSize($('newSize').value);
  $('newSize').classList.toggle('bad', !v);
  if (!v) { toast('「324×465」のように 幅×奥行 を数字で入力してください'); return; }
  addRect(v[0], v[1]);
});
$('newSize').addEventListener('input', () => $('newSize').classList.remove('bad'));
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  $('newSize').value = b.dataset.size;
  const v = parseSize(b.dataset.size);
  addRect(v[0], v[1]);
});

// ---------- 座標 ----------
function toWorld(ev) {
  const r = svg.getBoundingClientRect();
  return { x: view.x + (ev.clientX - r.left) / view.s, y: view.y + (ev.clientY - r.top) / view.s };
}
function zoomAt(sx, sy, f) {
  const ns = Math.max(0.005, Math.min(5, view.s * f));
  const wx = view.x + sx / view.s, wy = view.y + sy / view.s;
  view.s = ns;
  view.x = wx - sx / ns; view.y = wy - sy / ns;
  render();
}
function fit() {
  const r = svg.getBoundingClientRect();
  if (!shapes.length) { view.s = 0.1; view.x = -r.width / 2 / view.s; view.y = -r.height / 2 / view.s; render(); return; }
  const b = bounds(shapes), m = Math.max(b.w, b.h) * 0.15 + 100;
  view.s = Math.max(0.005, Math.min(2, Math.min(r.width / (b.w + m * 2), r.height / (b.h + m * 2))));
  view.x = b.x + b.w / 2 - r.width / 2 / view.s;
  view.y = b.y + b.h / 2 - r.height / 2 / view.s;
  render();
}
function bounds(list) {
  const x = Math.min(...list.map(s => s.x)), y = Math.min(...list.map(s => s.y));
  const X = Math.max(...list.map(s => s.x + s.w)), Y = Math.max(...list.map(s => s.y + s.h));
  return { x, y, w: X - x, h: Y - y };
}

// ---------- スナップ ----------
function edges(exceptId) {
  const xs = [], ys = [];
  for (const s of shapes) {
    if (s.id === exceptId) continue;
    xs.push(s.x, s.x + s.w, s.x + s.w / 2);
    ys.push(s.y, s.y + s.h, s.y + s.h / 2);
  }
  return { xs, ys };
}
const toGrid = v => Math.round(v / grid) * grid;
// 区間 [pos, pos+size] の端か中心を他の四角の辺へ。なければグリッドへ
function snapSpan(pos, size, targets) {
  const thr = 10 / view.s;
  let best = null;
  if (magnet) for (const t of targets) for (const off of [0, size, size / 2]) {
    const d = t - (pos + off);
    if (Math.abs(d) < thr && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, g: t };
  }
  if (best) return { v: Math.round(pos + best.d), guide: best.g };
  return { v: toGrid(pos), guide: null };
}
function snapPoint(v, targets) {
  const thr = 10 / view.s;
  let best = null;
  if (magnet) for (const t of targets) { const d = t - v; if (Math.abs(d) < thr && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, g: t }; }
  if (best) return { v: Math.round(best.g), guide: best.g };
  return { v: toGrid(v), guide: null };
}

// ---------- 操作 ----------
const pointers = new Map();
let drag = null;

svg.addEventListener('pointerdown', ev => {
  svg.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size === 2) {
    if (drag && drag.moved) commit();
    const [a, b] = [...pointers.values()];
    drag = { mode: 'pinch', dist: Math.hypot(a.x - b.x, a.y - b.y), mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 } };
    showGuides(); return;
  }
  const p = toWorld(ev);
  const hEl = ev.target.closest('[data-handle]');
  const sEl = ev.target.closest('[data-id]');
  if (hEl && byId(selId)) {
    drag = { mode: 'resize', dir: hEl.dataset.handle, start: { ...byId(selId) }, p0: p, moved: false };
  } else if (sEl) {
    selId = sEl.dataset.id;
    drag = { mode: 'move', start: { ...byId(selId) }, p0: p, moved: false };
    render(); renderProps();
  } else {
    if (selId) { selId = null; render(); renderProps(); }
    drag = { mode: 'pan', c0: { x: ev.clientX, y: ev.clientY }, v0: { ...view } };
    svg.classList.add('panning');
  }
});

svg.addEventListener('pointermove', ev => {
  if (!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (!drag) return;
  if (drag.mode === 'pinch' && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const r = svg.getBoundingClientRect();
    view.x -= (mid.x - drag.mid.x) / view.s; view.y -= (mid.y - drag.mid.y) / view.s;
    zoomAt(mid.x - r.left, mid.y - r.top, dist / drag.dist);
    drag.dist = dist; drag.mid = mid;
    return;
  }
  if (drag.mode === 'pan') {
    view.x = drag.v0.x - (ev.clientX - drag.c0.x) / view.s;
    view.y = drag.v0.y - (ev.clientY - drag.c0.y) / view.s;
    render(); return;
  }
  const s = byId(selId); if (!s) return;
  const p = toWorld(ev);
  const dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
  if (!drag.moved && Math.hypot(dx, dy) * view.s < 3) return;
  drag.moved = true;
  const E = edges(s.id), st = drag.start;
  if (drag.mode === 'move') {
    const sx = snapSpan(st.x + dx, st.w, E.xs), sy = snapSpan(st.y + dy, st.h, E.ys);
    s.x = sx.v; s.y = sy.v;
    showGuides(sx.guide, sy.guide);
  } else {
    const d = drag.dir;
    let l = st.x, t = st.y, rr = st.x + st.w, b = st.y + st.h, gx = null, gy = null;
    if (d.includes('w')) { const q = snapPoint(st.x + dx, E.xs); l = Math.min(q.v, rr - MIN); gx = q.guide; }
    if (d.includes('e')) { const q = snapPoint(rr + dx, E.xs); rr = Math.max(q.v, l + MIN); gx = q.guide; }
    if (d.includes('n')) { const q = snapPoint(st.y + dy, E.ys); t = Math.min(q.v, b - MIN); gy = q.guide; }
    if (d.includes('s')) { const q = snapPoint(b + dy, E.ys); b = Math.max(q.v, t + MIN); gy = q.guide; }
    s.x = l; s.y = t; s.w = rr - l; s.h = b - t;
    showGuides(gx, gy);
  }
  render(); renderProps(true);
});

function endPointer(ev) {
  pointers.delete(ev.pointerId);
  if (!drag) return;
  if (drag.mode === 'pinch') { if (pointers.size === 0) drag = null; return; }
  if (drag.moved) commit();
  drag = null;
  svg.classList.remove('panning');
  showGuides();
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  // トラックパッドのピンチ（ctrl付き）とマウスホイールは拡大縮小、2本指スクロールは移動
  if (ev.ctrlKey || (ev.deltaX === 0 && !ev.shiftKey)) {
    zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0015) * (ev.deltaMode ? 30 : 1)));
  } else {
    view.x += ev.deltaX / view.s; view.y += ev.deltaY / view.s; render();
  }
}, { passive: false });

// ---------- 編集コマンド ----------
function rotateSel() {        // 幅と奥行を入れ替え（中心を保つ）
  const s = byId(selId); if (!s) return;
  const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
  [s.w, s.h] = [s.h, s.w];
  s.x = Math.round(cx - s.w / 2); s.y = Math.round(cy - s.h / 2);
  commit(); render(); renderProps();
}
function dupSel() {
  const s = byId(selId); if (!s) return;
  const c = { ...s, id: newId(), x: s.x + s.w };   // 右隣にぴったり
  shapes.push(c); selId = c.id;
  commit(); render(); renderProps();
}
function delSel() {
  if (!selId) return;
  shapes = shapes.filter(s => s.id !== selId); selId = null;
  commit(); render(); renderProps();
}
function nudge(dx, dy) {
  const s = byId(selId); if (!s) return;
  s.x += dx; s.y += dy; commit(); render(); renderProps(true);
}

document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, select, textarea')) return;
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  else if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); }
  else if (mod && ev.key.toLowerCase() === 'd') { ev.preventDefault(); dupSel(); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { if (selId) { ev.preventDefault(); delSel(); } }
  else if (ev.key === 'r' || ev.key === 'R') rotateSel();
  else if (ev.key === 'Escape') { selId = null; render(); renderProps(); }
  else if (ev.key.startsWith('Arrow') && selId) {
    ev.preventDefault();
    const st = ev.shiftKey ? 10 : 1;
    nudge({ ArrowLeft: -st, ArrowRight: st }[ev.key] || 0, { ArrowUp: -st, ArrowDown: st }[ev.key] || 0);
  }
});

// ---------- 選択中の四角 ----------
function renderProps(valuesOnly) {
  const el = $('props');
  const s = byId(selId);
  el.classList.toggle('none', !s);
  if (valuesOnly && s && $('psize')) {
    const set = (id, v) => { if (document.activeElement !== $(id)) $(id).value = v; };
    set('psize', sizeText(s)); set('px', s.x); set('py', s.y);
    $('pArea').innerHTML = areaHTML(s);
    return;
  }
  if (!s) {
    el.innerHTML = `<h2>使い方</h2>
      <p class="empty">左の欄に「324×465」のように幅×奥行（mm）を入れて追加します。四角を近づけると辺どうしが赤いガイドで吸着するので、隙間なく組み合わせられます。<br><br>四角をクリックすると、サイズ・位置・名前・色を1mm単位で変えられます。</p>
      <div class="keys"><kbd>R</kbd> 幅と奥行を入れ替え<br><kbd>Ctrl</kbd>+<kbd>D</kbd> 右隣に複製　<kbd>Del</kbd> 削除<br><kbd>←↑→↓</kbd> 1mm移動（Shiftで10mm）<br>ホイール：拡大縮小　背景ドラッグ：移動</div>`;
    return;
  }
  el.innerHTML = `
    <div class="field"><label for="psize">サイズ（幅×奥行 mm）</label><input type="text" class="num" id="psize" inputmode="numeric" autocomplete="off" value="${sizeText(s)}"></div>
    <div class="row2">
      <div class="field"><label for="px">位置 X mm</label><input type="number" class="num" id="px" step="1" value="${s.x}"></div>
      <div class="field"><label for="py">位置 Y mm</label><input type="number" class="num" id="py" step="1" value="${s.y}"></div>
    </div>
    <div class="area" id="pArea">${areaHTML(s)}</div>
    <div class="field"><label for="pn">名前（任意）</label><input type="text" id="pn" value="${esc(s.name || '')}" placeholder="例：寝室"></div>
    <div class="field"><label>色</label><div class="swatches">${COLORS.map(c => `<button class="swatch" data-c="${c}" style="background:${c}" aria-label="色 ${c}" aria-pressed="${s.color === c}"></button>`).join('')}</div></div>
    <div class="btnrow">
      <button class="btn" id="bRot">↻ 縦横入替</button>
      <button class="btn" id="bDup">複製</button>
      <button class="btn danger" id="bDel">削除</button>
    </div>`;
  $('psize').addEventListener('change', e => {
    const v = parseSize(e.target.value);
    e.target.classList.toggle('bad', !v);
    if (!v) { toast('「324×465」のように 幅×奥行 を数字で入力してください'); return; }
    [s.w, s.h] = v; e.target.value = sizeText(s);
    commit(); render(); renderProps(true);
  });
  $('psize').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  const posInput = (id, key) => $(id).addEventListener('change', e => {
    const v = Math.round(+e.target.value);
    if (!Number.isFinite(v)) { e.target.value = s[key]; return; }
    s[key] = v; e.target.value = v; commit(); render();
  });
  posInput('px', 'x'); posInput('py', 'y');
  $('pn').addEventListener('input', e => { s.name = e.target.value; render(); });
  $('pn').addEventListener('change', commit);
  el.querySelectorAll('.swatch').forEach(b => b.addEventListener('click', () => {
    s.color = b.dataset.c; commit(); render(); renderProps();
  }));
  $('bRot').onclick = rotateSel; $('bDup').onclick = dupSel; $('bDel').onclick = delSel;
}
function areaHTML(s) {
  const m2 = areaM2(s);
  return `<span><b>${m2 < 10 ? m2.toFixed(3) : m2.toFixed(2)}</b> ㎡</span><span>${(m2 / JO).toFixed(2)} 帖</span>`;
}

// ---------- 保存・読込・出力 ----------
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const validRect = s => s && [s.x, s.y, s.w, s.h].every(Number.isFinite) && s.w >= MIN && s.h >= MIN;
function normalize(list) {
  return list.filter(validRect).map(s => ({
    id: s.id || newId(), x: Math.round(s.x), y: Math.round(s.y), w: Math.round(s.w), h: Math.round(s.h),
    name: s.name || '', color: s.color || '#ffffff',
  }));
}
$('save').onclick = () => {
  download('madori.json', new Blob([JSON.stringify({ version: 2, shapes }, null, 2)], { type: 'application/json' }));
  toast('JSONを保存しました');
};
$('load').onclick = () => $('file').click();
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.shapes;
    if (!Array.isArray(list)) throw new Error();
    shapes = normalize(list); selId = null;
    commit(); fit(); renderProps(); toast('読み込みました');
  } catch (err) { toast('読み込めませんでした。間取りメーカーで保存したJSONを選んでください'); }
  e.target.value = '';
});
$('png').onclick = () => {
  if (!shapes.length) { toast('四角がありません'); return; }
  const b = bounds(shapes), m = Math.max(b.w, b.h) * 0.06 + 50;
  const k = Math.min(4, 1600 / Math.max(b.w + m * 2, b.h + m * 2));
  const W = Math.ceil((b.w + m * 2) * k), H = Math.ceil((b.h + m * 2) * k);
  const src = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${b.x - m} ${b.y - m} ${b.w + m * 2} ${b.h + m * 2}">` +
    `<style>*{vector-effect:non-scaling-stroke}</style><rect x="${b.x - m}" y="${b.y - m}" width="${b.w + m * 2}" height="${b.h + m * 2}" fill="#fff"/>` +
    shapes.map(shapeSVG).join('') + shapes.map(s => labelSVG(s, k * 1.3)).join('') + '</svg>';
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
    const ctx = c.getContext('2d'); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
    c.toBlob(bl => { download('madori.png', bl); toast('PNGを保存しました'); });
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
};
let clearArmed = false;
$('clear').onclick = () => {
  if (!clearArmed) {
    clearArmed = true; $('clear').textContent = 'もう一度押すと消去';
    setTimeout(() => { clearArmed = false; $('clear').textContent = '全消去'; }, 2500);
    return;
  }
  clearArmed = false; $('clear').textContent = '全消去';
  shapes = []; selId = null; commit(); render(); renderProps(); toast('すべて消去しました（戻すで復元できます）');
};
$('undo').onclick = undo; $('redo').onclick = redo;
$('fit').onclick = fit;
$('zoomIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); };
$('zoomOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 0.8); };
$('gridSel').onchange = e => { grid = +e.target.value; };
$('magnet').onchange = e => { magnet = e.target.checked; };

// ---------- 起動 ----------
function example() {   // 初回だけ表示する例
  return [
    { id: newId(), x: 0, y: 0, w: 324, h: 465, name: '', color: '#f6ead3' },
    { id: newId(), x: 324, y: 0, w: 500, h: 465, name: '', color: '#d5e9f4' },
    { id: newId(), x: 0, y: 465, w: 824, h: 210, name: '', color: '#e2ecd2' },
  ];
}
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
if (saved && Array.isArray(saved.shapes)) {
  shapes = normalize(saved.shapes);
  if (Array.isArray(saved.recent) && saved.recent.length) recent = saved.recent.filter(t => parseSize(t)).slice(0, 8);
} else {
  shapes = example();
}
renderChips();
commit();
renderProps();
requestAnimationFrame(fit);
window.addEventListener('resize', render);
})();
</script>
<!-- APP END -->
