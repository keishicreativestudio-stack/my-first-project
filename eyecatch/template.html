<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-maru-gothic.css">
<style>
/* AIチャレンジ365 見出し画像テンプレート（1280×670） */
:root{--bg:#f7f6f1;--ink:#26292b;--sub:#8a8d8c;--accent:#ef7654}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.series{position:absolute;top:52px;left:0;right:0;text-align:center;font-size:24px;font-weight:700;letter-spacing:.18em;color:var(--sub)}
.series b{color:var(--accent);font-weight:900;margin-left:.5em;letter-spacing:.06em}
.main{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:34px;padding-top:20px}
.main h1{font-size:84px;font-weight:900;letter-spacing:.04em;line-height:1.25;text-align:center}
.main h1 em{font-style:normal;color:var(--accent)}
.main p{font-size:30px;font-weight:700;color:var(--sub);letter-spacing:.1em}
.rule{width:56px;height:5px;border-radius:3px;background:var(--accent)}
/* 小さなスタンプのモチーフ */
.stamp{position:absolute;width:92px;height:92px;border-radius:24px;border:5px solid var(--ink);background:#fff;display:grid;place-items:center}
.stamp i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ink);top:32px}
.stamp i:first-child{left:26px}.stamp i:nth-child(2){right:26px}
.stamp s{position:absolute;top:48px;width:26px;height:13px;border:5px solid var(--ink);border-top:none;border-radius:0 0 16px 16px}
.s1{right:110px;top:92px;transform:rotate(12deg)}
.s2{left:110px;bottom:84px;transform:rotate(-10deg);border-color:var(--accent)}
.s2 i{background:var(--accent)}.s2 s{border-color:var(--accent)}
</style></head><body>
<div class="series">AIチャレンジ365<b>Day 10</b></div>
<div class="main">
  <h1>フォロワーなしでも、<br><em>売れる？</em></h1>
  <div class="rule"></div>
  <p>人気LINEスタンプの共通点</p>
</div>
<div class="stamp s1"><i></i><i></i><s></s></div>
<div class="stamp s2"><i></i><i></i><s></s></div>
</body></html>
