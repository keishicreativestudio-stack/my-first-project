<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lighthouse Above the Clouds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1026;
    --ink: #efe6d2;
    --muted: #a9a3b8;
    --gold: #e7b65c;
    --teal: #5fd6cf;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.25rem;
    line-height: 1.6;
  }
  header {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem 16px;
    background:
      linear-gradient(to bottom, rgba(11,16,38,.35), var(--bg)),
      url("images/scene-01.jpg") center / cover no-repeat;
  }
  header h1 {
    font-size: clamp(2.4rem, 7vw, 4.8rem);
    font-weight: 600;
    margin: 0 0 .5rem;
    letter-spacing: .02em;
    text-shadow: 0 2px 24px rgba(0,0,0,.6);
  }
  header p { margin: 0; color: var(--gold); font-style: italic; }
  .hint { margin-top: 3rem; font-size: 1rem; color: var(--muted); animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  .chapter {
    text-align: center;
    color: var(--teal);
    letter-spacing: .3em;
    text-transform: uppercase;
    font-size: .95rem;
    margin: 6rem 16px 2rem;
  }
  figure {
    max-width: 1100px;
    margin: 0 auto 5rem;
    padding: 0 16px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  figure.visible { opacity: 1; transform: none; }
  figure img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(231,182,92,.18);
  }
  figcaption {
    max-width: 680px;
    margin: 1.5rem auto 0;
    text-align: center;
  }
  figcaption .num { display: block; color: var(--gold); font-size: .9rem; letter-spacing: .2em; }
  footer { text-align: center; padding: 4rem 16px 6rem; color: var(--muted); }
  footer .end { font-size: 2rem; color: var(--gold); font-style: italic; }
  @media (prefers-reduced-motion: reduce) {
    figure { opacity: 1; transform: none; transition: none; }
    .hint { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>The Lighthouse Above the Clouds</h1>
    <p>A girl, a clockwork bird, and the light that woke the sky</p>
    <div class="hint">scroll to begin ↓</div>
  </div>
</header>

<main id="story"></main>

<footer>
  <div class="end">— The End —</div>
</footer>

<script>
  const story = [
    { chapter: "I · The Floating Town" },
    { text: "Every night, Rin watched the dark lighthouse far across the sea of clouds. It hadn't shone in a hundred years." },
    { text: "In her workshop she finished the last wing of her clockwork bird. Its amber eye flickered open." },
    { text: "Together they crossed the rope bridges, toward the edge of everything she knew." },
    { text: "The bird led her deeper, along a forest path lit by glowing lanterns." },
    { chapter: "II · The Voyage" },
    { text: "At the old dock waited a small sky-boat, a compass rose painted on its sail." },
    { text: "They cast off into the moonlit clouds, the lighthouse ahead of them." },
    { text: "Then the storm came. Lightning tore the sail, and Rin held the bird close and didn't let go." },
    { text: "Battered but whole, they landed at the foot of the great tower." },
    { chapter: "III · The Tower" },
    { text: "Inside, the tower was one vast clock of silent gears, waiting." },
    { text: "Lantern-light revealed a mural of every floating island, and at its heart, a bird and a key." },
    { text: "Rin understood. She ran up the spiral stairs as fast as she could." },
    { text: "At the very top, in front of the great lens, stood an empty pedestal shaped for a bird." },
    { text: "“So you were the key all along.”" },
    { text: "Through her tears, she set the bird in its place. The tower began to hum." },
    { chapter: "IV · Dawn" },
    { text: "Light burst from the lighthouse and spread its wings across the whole sky." },
    { text: "In every town, people came out and looked up as the old light returned." },
    { text: "All that was left in Rin's hands was a single glowing feather." },
    { text: "As the sun rose, a living swallow landed on her finger. Rin smiled. Her friend was everywhere now." },
  ];

  const main = document.getElementById("story");
  let n = 0;
  for (const item of story) {
    if (item.chapter) {
      const h = document.createElement("h2");
      h.className = "chapter";
      h.textContent = item.chapter;
      main.appendChild(h);
      continue;
    }
    n++;
    const id = String(n).padStart(2, "0");
    const fig = document.createElement("figure");
    fig.innerHTML = `<img src="images/scene-${id}.jpg" alt="" loading="lazy" width="1600" height="900">
      <figcaption><span class="num">${id}</span>${item.text}</figcaption>`;
    fig.querySelector("img").alt = item.text;
    main.appendChild(fig);
  }

  const io = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
  }, { threshold: 0.15 });
  document.querySelectorAll("figure").forEach(f => io.observe(f));
</script>
</body>
</html>
