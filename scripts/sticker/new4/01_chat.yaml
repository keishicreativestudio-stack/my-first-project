# A:トーク型 ― 上司・先輩に送っても失礼にならない、を職場の会話で見せる
type: sticker
variant: chat
# ▼正式名「定時で帰りたい書類」。検索ワードは正式名そのまま
title: "定時で帰りたい\n*書類*"
search: "定時で帰りたい書類"
stickers_dir: assets/stickers/new4
count: 16
cta_sub: "*この書類*が目印！\nプロフのリンクからも買えます"
theme:
  bg: "#FFF9EE"
  bg2: "#FCEFD8"
  pattern: "#FFFFFF"
  text: "#3B3024"
  accent: "#2F7FD0"
  header: "#2F7FD0"
  chat_bg: "#FFFDF8"
  them: "#F1ECE3"
  me: "#DDEBFF"
main_sticker: 05.png
bpm: 110
lineup_sec: 2.6
lineup_text: "仕事で使える\n*敬語*16種"
cta_sec: 3.2
post: {label: トーク型, time: "21:00"}

hook: "*上司に送っても*\n失礼にならない\nかわいいスタンプ"
hook_sticker: 05.png          # 確認します

chats:
  - caption: "*上司*からの依頼に"
    partner: "課長"
    messages:
      - {from: them, text: "明日の資料、\n確認お願いします"}
      - {from: me, sticker: 05.png, time: "10:12"}     # 確認します
  - caption: "*先輩*に助けられた時"
    partner: "先輩のみさき"
    messages:
      - {from: them, text: "例の件、\n代わりにやっといたよ"}
      - {from: me, sticker: 09.png, time: "15:40"}     # 助かります
  - caption: "*ちょっと遅れそう*な時"
    partner: "課長"
    messages:
      - {from: them, text: "もうすぐ会議だけど\n今どこ？"}
      - {from: me, sticker: 08.png, time: "13:57"}     # 今向かいます
  - caption: "で、*同期*に聞かれる"
    partner: "同期のゆい"
    messages:
      - {from: them, text: "その書類のスタンプ\nかわいい！どこの？"}
      - {from: me, text: "「定時で帰りたい書類」\nで検索してみて！"}

