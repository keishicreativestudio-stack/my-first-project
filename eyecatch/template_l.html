<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-maru-gothic.css">
<style>
/* L案：チャットの会話風（1280×670） */
:root{--bg:#eef1f5;--ink:#23272e;--sub:#7c8490;--me:#ffffff;--you:#3d6fd9}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.series{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:20px;font-weight:700;letter-spacing:.24em;color:var(--sub)}
.chat{position:absolute;left:230px;right:230px;top:120px;bottom:70px;display:grid;align-content:center;gap:34px}
.b{max-width:720px;padding:30px 44px;border-radius:44px;font-weight:900;line-height:1.35;position:relative}
.q{background:var(--me);font-size:52px;justify-self:start;border-bottom-left-radius:10px;box-shadow:0 6px 18px rgba(30,40,60,.06)}
.a{background:var(--you);color:#fff;font-size:44px;justify-self:end;border-bottom-right-radius:10px}
.q small{display:block;font-size:26px;font-weight:700;color:var(--sub);margin-bottom:6px}
.a small{display:block;font-size:22px;font-weight:700;opacity:.85;margin-top:6px}
.read{position:absolute;right:-4px;bottom:-30px;font-size:16px;color:var(--sub);font-weight:700}
</style></head><body>
<div class="series">AIチャレンジ365 ・ Day 10</div>
<div class="chat">
  <div class="b q"><small>フォロワーいないけど…</small>スタンプって売れるの？</div>
  <div class="b a">調べてみた！<small>人気スタンプの共通点</small><span class="read">既読</span></div>
</div>
</body></html>
