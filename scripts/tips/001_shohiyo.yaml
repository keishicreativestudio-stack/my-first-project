# 最初の1秒で「え？」と思わせる一言(*で囲むと黄色で強調)
hook: "物件価格だけで\n予算を決めると\n*数百万円*足りない"
sub: "家は「諸費用」が別にかかります"

points:
  - title: "諸費用の目安"
    body: "中古戸建なら\n物件価格の*約6〜10%*\n3,000万円なら*180〜300万円*"
  - title: "主な中身"
    body: "仲介手数料・登記費用\nローン事務手数料・保証料\n火災保険・税金 など"
  - title: "対策"
    body: "資金計画は\n*物件価格＋諸費用*で立てる\n諸費用もローンに\n組める場合あり"

conclusion: "予算は\n*諸費用込み*で考えよう"

