# チャンネル共通の見た目・名前の設定
# ここを変えると全動画に反映されます(統一感=覚えてもらえる=伸びる)

series_name: "家を買う前の30秒"      # 画面上部に毎回出るシリーズ名
handle: "@your_account"              # 画面下部に出すアカウント名
tagline: "現役・不動産営業の本音"     # 冒頭フックの上に小さく出る肩書き

# 物件紹介動画の末尾に表示(不動産広告の必要表示。自社の内容に書き換えてください)
company: "REDS株式会社"
license: "宅地建物取引業 免許番号 ○○知事(○)第○○○○○号"

colors:
  bg_top: "#0F2A4A"      # 背景グラデーション上(ネイビー=信頼感)
  bg_bottom: "#081828"   # 背景グラデーション下
  grid: "#1E4470"        # 背景の方眼(図面モチーフ)
  text: "#FFFFFF"
  accent: "#FFD23F"      # *強調* した文字・価格など
  outline: "#0A1A2E"     # 文字のフチ
  card: "#FFFFFF"        # 白カード
  card_text: "#10233D"

# 太字の日本語フォント(未指定なら Mac/Windows/Linux の標準フォントを自動検索)
# 例: fonts/NotoSansJP-Black.ttf を置いて指定すると一番きれいです
font: ""

# BGM: 空なら自動生成の軽いBGM。mp3/wav のパスを指定するとそれを使用
# ※TikTok/Reels ではアプリ内で流行りの音源を付ける方が伸びやすいので
#   その場合は `--no-bgm` で書き出してください
bgm: ""
bgm_volume: 0.35
