<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-old-mincho.css">
<style>
/* H案：縦書き（1280×670） */
:root{--bg:#fbfbf8;--ink:#23262a;--sub:#8c8f92;--accent:#3b5ba5}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Old Mincho",serif;color:var(--ink);position:relative;overflow:hidden}
.wrap{position:absolute;inset:0;display:flex;flex-direction:row-reverse;justify-content:center;align-items:center;gap:56px}
.v{writing-mode:vertical-rl;text-orientation:mixed}
h1{font-size:62px;font-weight:700;line-height:1.75;letter-spacing:.12em}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:24px;font-weight:500;color:var(--sub);letter-spacing:.2em;align-self:flex-end;margin-bottom:90px}
.line{width:1px;height:420px;background:var(--ink);opacity:.25}
.series{font-size:20px;letter-spacing:.3em;color:var(--sub);align-self:flex-start;margin-top:90px}
.series b{color:var(--accent);font-weight:700}
</style></head><body>
<div class="wrap">
  <div class="v series">AIチャレンジ<b>365</b>　第<b>10</b>日</div>
  <div class="line"></div>
  <h1 class="v">フォロワーが<br>いなくても、<br><em>売れる</em>のか。</h1>
  <div class="v sub">人気スタンプの共通点を調べる</div>
</div>
</body></html>
