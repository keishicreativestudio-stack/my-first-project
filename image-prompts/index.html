<title>PV画像プロンプト集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single working column of prompt cards grouped by video, with a sticky progress bar. */
:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --ink: #16181d;
  --muted: #5d6370;
  --line: #dde0e6;
  --accent: #2f5bff;
  --done: #1f8a5b;
  --done-soft: #e3f4ec;
  --code: #f6f7f9;
  --jp: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101216; --card: #181b21; --ink: #e8eaef; --muted: #9aa0ad; --line: #2b303a; --accent: #7d9bff; --done: #53c28f; --done-soft: #16291f; --code: #111418; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #101216; --card: #181b21; --ink: #e8eaef; --muted: #9aa0ad; --line: #2b303a; --accent: #7d9bff; --done: #53c28f; --done-soft: #16291f; --code: #111418; color-scheme: dark; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--jp); padding-inline: 16px; padding-block: 24px 64px; line-height: 1.7; }
.page { max-width: 820px; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-weight: 900; font-size: 26px; margin: 0 0 6px; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 14px; max-width: 64ch; }
.how { display: grid; gap: 6px; margin: 12px 0 0; padding-left: 1.2em; font-size: 14px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.bar .count { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.bar nav { display: flex; gap: 8px; flex-wrap: wrap; }
.bar nav a { font-size: 13px; color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--card); }
.bar nav a:hover { border-color: var(--accent); }
.meter { flex: 1 1 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
.meter i { display: block; height: 100%; background: var(--done); width: 0; transition: width .2s; }
section { display: grid; gap: 12px; scroll-margin-top: 70px; }
section > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
section h2 { font-size: 20px; font-weight: 900; margin: 0; }
section header span { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card.is-done { border-color: var(--done); background: linear-gradient(0deg, var(--done-soft), var(--done-soft)) top / 100% 4px no-repeat, var(--card); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.file { font: 500 14px var(--mono); }
.chip { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; color: var(--muted); }
.chip.ratio { color: var(--accent); border-color: var(--accent); }
.where { font-size: 12px; color: var(--muted); width: 100%; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 400 13px/1.6 var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; user-select: all; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button.copy { font: 700 13px var(--jp); color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; min-width: 110px; }
button.copy.ok { background: var(--done); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.note { font-size: 13px; color: var(--muted); }
</style>

<main class="page">
  <header>
    <h1>PV画像プロンプト集</h1>
    <p class="lede">3本の試作動画（サイバー・雑誌風・和モダン）に入れる画像のプロンプトです。1枚＝1プロンプトになっていて、比率・キャラ設定・雰囲気まで全部入っています。</p>
    <ol class="how">
      <li>「コピー」を押して、画像生成AI（ChatGPTなど）にそのまま貼る</li>
      <li>できた画像を、カードに書いてあるファイル名で保存する</li>
      <li>「生成済み」にチェックを入れる（この端末のブラウザに記録されます）</li>
    </ol>
  </header>

  <div class="bar">
    <nav aria-label="動画ごとに移動"><a href="#cyber">サイバー</a><a href="#editorial">雑誌風</a><a href="#wa">和モダン</a></nav>
    <span class="count" id="count">0 / 38</span>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
  </div>

  <div id="list"></div>
</main>

<script>
const CHAR = 'an original chibi character: a small person with a short bob haircut and a beret, holding a sketchbook, with a small fox companion';
const RATIO = { '3:4': 'Aspect ratio 3:4, portrait.', '9:16': 'Aspect ratio 9:16, vertical.', '1:1': 'Aspect ratio 1:1, square.', '16:9': 'Aspect ratio 16:9, landscape.' };
const STYLE = {
  cyber: 'Dark background, electric blue neon glow, cinematic lighting, high contrast. No text, no letters, no watermark.',
  editorial: 'Editorial photography, soft natural light, muted pastel palette of fog grey, blush pink, sage green, lilac and apricot, subtle film grain, minimal and calm. No text, no letters, no watermark.',
  wa: 'Japanese modern aesthetic, washi paper texture, sumi ink, vermilion red accent, generous negative space. No text, no letters, no watermark.',
};
const GROUPS = [
  { id: 'cyber', name: '① サイバー版（青ネオン）', dir: 'pv-prototype', items: [
    ['cyber_poster_01.png', '3:4', '上下分割の場面「ポスター」1枚目／作品の連打', 'A minimalist graphic poster with a spring theme: bold geometric shapes and an abstract cherry blossom motif, dominant warm red and coral on dark navy.'],
    ['cyber_poster_02.png', '3:4', '上下分割の場面「ポスター」2枚目／作品の連打', 'A minimalist graphic poster about a night festival: a large yellow circle and sharp diagonal shapes, dominant yellow and black on dark navy.'],
    ['cyber_poster_03.png', '3:4', '上下分割の場面「ポスター」3枚目／作品の連打', 'A minimalist graphic poster about a new opening: overlapping green arcs and a thin grid, dominant emerald green and cream on dark navy.'],
    ['cyber_character_01.png', '9:16', '上下分割の場面「キャラクター」／作品の連打', `A full-body silhouette of ${CHAR}, standing and facing the viewer, face in shadow, strong blue backlight creating a glowing rim light around the outline. Transparent background PNG.`],
    ['cyber_sticker_01.png', '1:1', '上下分割の場面「LINEスタンプ」1枚目', `A LINE sticker of ${CHAR}, waving happily. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_02.png', '1:1', '上下分割の場面「LINEスタンプ」2枚目', `A LINE sticker of ${CHAR}, bowing politely to say thank you. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_03.png', '1:1', '上下分割の場面「LINEスタンプ」3枚目', `A LINE sticker of ${CHAR}, sleepy with half-closed eyes. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_04.png', '1:1', '上下分割の場面「LINEスタンプ」4枚目', `A LINE sticker of ${CHAR}, giving a thumbs up. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_05.png', '1:1', '上下分割の場面「LINEスタンプ」5枚目', `A LINE sticker of ${CHAR}, with heart eyes and small hearts around. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_06.png', '1:1', '上下分割の場面「LINEスタンプ」6枚目', `A LINE sticker of ${CHAR}, tired and slumped over the sketchbook. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_07.png', '1:1', '上下分割の場面「LINEスタンプ」7枚目', `A LINE sticker of ${CHAR}, looking proud with hands on hips. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_sticker_08.png', '1:1', '上下分割の場面「LINEスタンプ」8枚目', `A LINE sticker of ${CHAR}, jumping for joy. Thick white outline, flat pastel colors, simple and cute. Transparent background PNG.`],
    ['cyber_film_01.png', '16:9', '上下分割の場面「動画」のフィルム／作品の連打', 'A cinematic film still of a night city rooftop overlooking skyscrapers, teal and blue color grade, anamorphic lens, moody atmosphere.'],
    ['cyber_film_02.png', '16:9', '上下分割の場面「動画」のフィルム／作品の連打', 'A cinematic film still of a rainy neon-lit street at night with reflections on wet asphalt, teal and blue color grade, anamorphic lens, moody atmosphere.'],
    ['cyber_film_03.png', '16:9', '上下分割の場面「動画」のフィルム／作品の連打', 'A cinematic film still of the ocean at dusk with a lone figure on the shore, teal and blue color grade, anamorphic lens, moody atmosphere.'],
    ['cyber_film_04.png', '16:9', '上下分割の場面「動画」のフィルム／作品の連打', 'A cinematic film still of a winding mountain road at night with streaks of car lights, teal and blue color grade, anamorphic lens, moody atmosphere.'],
    ['cyber_logo_01.png', '3:4', '作品の連打「LOGO」', 'A brand identity mockup: a glowing blue geometric logo symbol made of a circle and a triangle, presented on a dark matte card, premium studio lighting.'],
    ['cyber_logo_02.png', '3:4', '作品の連打「LOGO」', 'A brand identity mockup: a glowing blue abstract logo symbol made of three overlapping rings, presented on a dark matte card, premium studio lighting.'],
    ['cyber_logo_03.png', '3:4', '作品の連打「LOGO」', 'A brand identity mockup: a glowing blue monoline logo symbol shaped like a lightning bolt inside a square, presented on a dark matte card, premium studio lighting.'],
  ] },
  { id: 'editorial', name: '② 雑誌風（おしゃれ版）', dir: 'pv-editorial', items: [
    ['ed_poster.png', '3:4', '見開き 01「Poster」／漂う作品', 'A minimalist Japanese-style art poster: a large apricot circle and one thin ink-black line on off-white paper, Swiss graphic design, lots of negative space.'],
    ['ed_character.png', '3:4', '見開き 02「Character」／漂う作品', `${CHAR}, shown as a soft dark silhouette against a warm peach sunset glow, dreamy and gentle backlight, full body.`],
    ['ed_stickers.png', '3:4', '見開き 03「Sticker」／漂う作品', `A sticker sheet with four cute stickers of ${CHAR} in different moods (happy, thankful, sleepy, cheering), arranged in a 2x2 grid on off-white paper, flat pastel illustration.`],
    ['ed_film.png', '3:4', '見開き 04「Film」／漂う作品', 'A film still of a person standing alone by a calm sea at dusk, pastel pink and lilac sky, Kodak Portra tones, black letterbox bars at top and bottom.'],
    ['ed_still_01.png', '16:9', '3段の誌面 i', 'A still life set: a plaster arch and a matte sphere on a small pedestal, soft shadows, sage green backdrop, product photography.'],
    ['ed_still_02.png', '16:9', '3段の誌面 iii', 'A still life set: a plaster arch and a glossy sphere on a small pedestal, soft shadows, lilac backdrop, product photography.'],
    ['ed_still_03.png', '16:9', '3段の誌面 ii（左右2枚並びの左）', 'A still life set: stacked plaster blocks and a small apricot sphere, soft shadows, warm sand backdrop, product photography.'],
    ['ed_poster_wide.png', '16:9', '3段の誌面 ii', 'A minimal art print hanging in a bright gallery, composition in apricot and ink black with lots of negative space.'],
    ['ed_film_wide.png', '16:9', '3段の誌面 i（差し替え後）', 'A wide cinematic shot of a quiet seaside town at golden hour, pastel tones, nostalgic mood.'],
    ['ed_monogram.png', '16:9', '3段の誌面 iii（差し替え後）', 'A luxury monogram logo mockup: a thin line circle around an elegant serif initial, embossed on off-white textured paper, soft side light.'],
  ] },
  { id: 'wa', name: '③ 和モダン版', dir: 'pv-wa', items: [
    ['wa_poster.png', '3:4', '作品 壱（障子が開く）', 'A Japanese modern poster: a large vermilion circle, spring night mood, minimal composition on kinari cream paper.'],
    ['wa_kamon.png', '3:4', '作品 弐（扇が広がる）', 'An original Japanese family-crest (kamon) style logo: a geometric three-leaf motif inside a circle, black ink on cream washi paper.'],
    ['wa_character.png', '3:4', '作品 参（暖簾が割れる）', `A black silhouette of ${CHAR}, standing under a huge full moon, indigo night sky, pampas grass in the foreground, ukiyo-e inspired.`],
    ['wa_sansui.png', '3:4', '作品 肆（巻物がほどける）', 'A sumi-e ink wash landscape: layered misty mountains, a small red sun, a seigaiha wave pattern along the bottom.'],
    ['wa_grid_sansui.png', '9:16', '文様タイル（左上）', 'A sumi-e ink wash landscape: layered misty mountains, a small red sun, a seigaiha wave pattern along the bottom, tall vertical composition.'],
    ['wa_grid_kamon.png', '9:16', '文様タイル（右上・右下）', 'An original kamon crest with a white plum blossom motif, centered on a deep indigo background, tall vertical composition.'],
    ['wa_grid_wagashi.png', '9:16', '文様タイル（右上）', 'Three seasonal Japanese wagashi sweets in soft pink, pale green and cream on a dark lacquer plate, overhead view, soft light, tall vertical composition.'],
    ['wa_grid_poster.png', '9:16', '文様タイル（左下）', 'A Japanese poster with a vermilion sun and an autumn rain mood, cream paper, tall vertical composition.'],
    ['wa_grid_moon.png', '9:16', '文様タイル（右下）', `A black silhouette of ${CHAR}, under a huge full moon, indigo night sky, pampas grass, ukiyo-e inspired, tall vertical composition.`],
  ] },
];

const full = (g, it) => `${it[3]} ${STYLE[g.id]} ${RATIO[it[1]]}`;
const KEY = 'pv-prompts-done';
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
const total = GROUPS.reduce((n, g) => n + g.items.length, 0);

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('list').innerHTML = GROUPS.map(g => `
  <section id="${g.id}">
    <header><h2>${g.name}</h2><span>${g.items.length}枚 · 保存先フォルダ ${g.dir}/images</span></header>
    ${g.items.map((it, i) => `
      <article class="card" data-file="${it[0]}">
        <div class="head">
          <span class="file">${it[0]}</span>
          <span class="chip ratio">${it[1]}</span>
          <span class="chip">${i + 1} / ${g.items.length}</span>
          <span class="where">使う場所：${it[2]}</span>
        </div>
        <pre id="p-${it[0]}">${esc(full(g, it))}</pre>
        <div class="actions">
          <button class="copy" type="button" data-target="p-${it[0]}">コピー</button>
          <label class="check"><input type="checkbox" id="d-${it[0]}" data-file="${it[0]}"> 生成済み</label>
        </div>
      </article>`).join('')}
  </section>`).join('');

function refresh() {
  let n = 0;
  document.querySelectorAll('.card').forEach(c => {
    const f = c.dataset.file, on = !!done[f];
    c.classList.toggle('is-done', on);
    document.getElementById('d-' + f).checked = on;
    if (on) n++;
  });
  document.getElementById('count').textContent = `${n} / ${total} 生成済み`;
  document.getElementById('meter').style.width = (n / total * 100) + '%';
}
document.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.file; if (!f || e.target.type !== 'checkbox') return;
  if (e.target.checked) done[f] = 1; else delete done[f];
  try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
  refresh();
});
document.addEventListener('click', e => {
  const btn = e.target.closest('button.copy'); if (!btn) return;
  const pre = document.getElementById(btn.dataset.target), text = pre.textContent;
  const ok = () => { btn.textContent = 'コピーしました'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('ok'); }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '選択しました'; setTimeout(() => { btn.textContent = 'コピー'; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
});
refresh();
</script>
