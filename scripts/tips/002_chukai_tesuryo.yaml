type: tips
episode: 3
hook: "仲介手数料って\n*いくら*か知ってる？"
sub: "実は法律で上限が決まっています"
points:
  - title: "上限の計算式"
    body: "400万円を超える物件なら\n*価格×3%＋6万円*\n＋消費税"
  - title: "例えば"
    body: "3,000万円の家なら\n(90万＋6万)×1.1＝\n*105.6万円*が上限"
  - title: "払うタイミング"
    body: "契約時と引渡し時に\n*半分ずつ*が多い\n事前に確認しよう"
conclusion: "上限を知っておけば\n*資金計画*がラクになる"
caption: |
  仲介手数料は「価格×3%＋6万円＋税」が上限です（400万円超の場合）。
  3,000万円の家なら105.6万円。資金計画に入れておきましょう🏠
hashtags: [仲介手数料, 家探し, マイホーム, 住宅購入, 不動産, 家を買う前に]
