<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/dela-gothic-one.css"><link rel="stylesheet" href="fonts/zen-kaku-gothic-new.css">
<style>
/* I案：Q&Aカード（1280×670） */
:root{--bg:#e8f1f8;--card:#ffffff;--ink:#1f2a37;--sub:#6b7888;--q:#2f6fd1;--a:#f08a24}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.series{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;letter-spacing:.26em;color:var(--sub)}
.card{position:absolute;left:170px;right:170px;top:100px;bottom:70px;background:var(--card);border-radius:28px;display:grid;align-content:center;gap:34px;padding:0 70px}
.row{display:grid;grid-template-columns:110px 1fr;align-items:center}
.mk{font-family:"Dela Gothic One",sans-serif;font-size:84px;line-height:1}
.q .mk{color:var(--q)} .a .mk{color:var(--a);font-size:64px}
.q p{font-size:60px;font-weight:900;line-height:1.35}
.a p{font-size:32px;font-weight:500;color:var(--sub)}
.a p b{color:var(--ink);font-weight:900}
.div{height:0;border-top:3px dashed #d3dde8}
</style></head><body>
<div class="series">AIチャレンジ365 ・ DAY 10</div>
<div class="card">
  <div class="row q"><span class="mk">Q.</span><p>フォロワーなしでも、<br>スタンプは売れる？</p></div>
  <div class="div"></div>
  <div class="row a"><span class="mk">A.</span><p><b>人気スタンプの共通点</b>から考えてみた</p></div>
</div>
</body></html>
