type: tips
episode: 6
hook: "内見で*ここ*を\n見ない人は損する"
sub: "不動産屋が実際に見ているポイント"
points:
  - title: "水回りの下"
    body: "キッチン・洗面台の\n収納を開けて\n*水漏れ跡・カビ臭*を確認"
  - title: "床の傾き"
    body: "スマホの*水平器アプリ*で\n部屋の数か所をチェック"
  - title: "時間を変えて"
    body: "*夜や休日*に\nもう一度周辺を歩くと\n騒音・人通りがわかる"
conclusion: "内見は\n*家の外*まで見よう"
caption: |
  内見でチェックしてほしい3つのポイント。
  特に「時間帯を変えて周辺を見る」は意外とやらない人が多いです👀
hashtags: [内見, 内覧, 家探し, 中古戸建, マイホーム, 不動産, 家を買う前に]
