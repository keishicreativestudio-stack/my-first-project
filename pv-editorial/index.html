<style>
/* Layout: a vertical 9:16 monitor beside a quiet contents list, like a magazine's table of contents. Single committed light look. */
:root {
  --fog: #e5e7e8;
  --paper: #f1f2f2;
  --ink: #1e2023;
  --ink-2: #6b6f76;
  --rule: #cfd3d6;
  --apricot: #d9895e;
  --serif-jp: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --serif: "Cormorant Garamond", "Times New Roman", serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { background: var(--fog); color: var(--ink); }
body { font-family: var(--serif-jp); padding-inline: 16px; padding-block: 24px 48px; line-height: 1.8; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
.screen { width: min(100%, calc(84vh * 9 / 16)); max-width: 100%; aspect-ratio: 9 / 16; background: var(--paper); justify-self: center; box-shadow: 0 30px 60px -30px rgba(30, 32, 35, .35); }
.screen canvas { display: block; width: 100%; height: 100%; }
.side { display: grid; gap: 20px; min-width: 0; }
.kicker { font: 400 11px var(--mono); letter-spacing: .18em; color: var(--ink-2); text-transform: uppercase; }
h1 { font: italic 500 40px/1.05 var(--serif); margin: 4px 0 6px; }
.lede { font-size: 14px; color: var(--ink-2); margin: 0; max-width: 40ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 400 12px var(--mono); letter-spacing: .06em; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
button:hover { background: var(--ink); color: var(--paper); }
button.primary { background: var(--ink); color: var(--paper); min-width: 96px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--apricot); outline-offset: 2px; }
.tc { font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
.tc small { color: var(--ink-2); }
input[type=range] { width: 100%; accent-color: var(--ink); margin: 0; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font: 400 12px var(--mono); color: var(--ink-2); }
ol.toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
ol.toc li { border-bottom: 1px solid var(--rule); }
ol.toc button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: baseline; padding: 11px 4px; }
ol.toc button:focus-visible { outline: 2px solid var(--apricot); }
ol.toc .n { font: italic 500 22px var(--serif); }
ol.toc b { font-weight: 600; font-size: 15px; }
ol.toc span.d { display: block; font-size: 12px; color: var(--ink-2); }
ol.toc .t { font: 400 11px var(--mono); color: var(--ink-2); }
ol.toc li.on .n, ol.toc li.on b { color: var(--apricot); }
</style>

<script>

/* ================= canvases ================= */
const cv = $('cv'), ctx = cv.getContext('2d');

let S = 1;
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(Math.round(cv.clientWidth * d), 1080);
  if (!w) return;
  const h = Math.round(w * 16 / 9);
  for (const c of [cv, buf, layer]) { c.width = w; c.height = h; }

}
let grains = [], vignette;
function buildGrain() {
  grains = [0, 1, 2, 3, 4, 5].map(k => {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d'), im = g.createImageData(180, 180);
    for (let i = 0; i < im.data.length; i += 4) { const v = hash(i * .61 + k * 777) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }

  });
}
function buildVignette() {
  vignette = document.createElement('canvas'); vignette.width = cv.width; vignette.height = cv.height;

/* ================= shared drawing helpers ================= */
/* tapered strand: used for hair tufts and fur */
function leaf(g, x, y, ang, len, w, curl) {
  const nx = -Math.sin(ang), ny = Math.cos(ang);
  const ta = ang + curl, tx = x + Math.cos(ta) * len, ty = y + Math.sin(ta) * len;

    const dir = Math.cos(a) >= 0 ? 1 : -1;
    L(x + Math.cos(a) * r * .75, y + Math.sin(a) * r * .75, a + dir * .25, 22 + hash(i + 90) * 14, 16, dir * (.7 + hash(i + 95) * .4));
  }

  const wisp = [[-1, 150, 2.5, 34, 20, -.7], [-1, 176, 2.1, 30, 18, -.6], [-1, 118, 3.0, 26, 18, -.5],

  for (const [sd, y, ang, len, w, curl] of wisp) L(hx + sd * (rx - 14), y, ang, len, w, curl);
  /* flicks on the crown */
  L(126, 60, -1.75, 34, 9, 1.0); L(100, 62, -1.55, 22, 8, -.9); L(150, 70, -1.2, 22, 8, .8);

  /* hoodie body, hands tucked in the front pocket */
  solid(g, () => {

  const e = E.inOutSine(k), x = lerp(-200, 740, e), y = lerp(260, 700, e), A = Math.sin(Math.PI * k) * amt;
  b.save(); b.globalCompositeOperation = 'screen';
  for (const [dx, dy, r, c] of [[0, 0, 360, '229,154,111'], [120, -160, 240, '232,190,160'], [-90, 180, 200, '201,154,147']]) {
    const g = b.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
    g.addColorStop(0, `rgba(${c},${A})`); g.addColorStop(1, `rgba(${c},0)`);
    b.fillStyle = g; b.fillRect(0, 0, LW, LH);
  }
  b.restore();
}

function rowContent(g, ev, y, h, t) {
  g.fillStyle = ev.bg; g.fillRect(0, y, LW, h);
  if (ev.word) {
    const dark = ev.bg === P.ink;
    g.fillStyle = dark ? P.paper : P.ink; g.font = it(400, 118); g.fillText(ev.word[0], 36, y + h * .66);
    g.font = jp(600, 16); vtext(g, ev.word[1], 500, y + 28, 16);
    return;
  }
  const u = t - (T0.grid + ev.j * BEAT);
  drawWork(g, ev.work, ev.seed, 0, y, LW, h, 1.08 - .06 * E.inOutSine(clamp(u / 2)));
  g.fillStyle = 'rgba(241,242,242,.92)'; g.fillRect(24, y + h - 44, 128, 24);
  g.fillStyle = P.ink; g.font = mono(400, 10); spaced(g, ev.work.toUpperCase() + ' · ' + String(ev.j + 1).padStart(2, '0'), 32, y + h - 28, 1.4);
}
function sceneGrid(t) {
  b.fillStyle = P.paper; b.fillRect(0, 0, LW, LH);
  /* empty rows wait as a faint layout grid with their numbers */
  b.save(); b.strokeStyle = 'rgba(30,32,35,.12)'; b.lineWidth = 1;
  for (let x = 45; x < LW; x += 90) { b.beginPath(); b.moveTo(x, 0); b.lineTo(x, LH); b.stroke(); }
  b.fillStyle = 'rgba(30,32,35,.35)'; b.font = it(400, 46);
  ROWS.forEach(([y, h], r) => b.fillText(['i', 'ii', 'iii'][r], 36, y + h / 2 + 14));
  b.font = mono(400, 10); ROWS.forEach(([y, h], r) => spaced(b, 'PLATE ' + String(r + 1).padStart(2, '0'), 36, y + h / 2 + 40, 2));
  b.restore();
  const out = T0.grid + 7 * BEAT;
  ROWS.forEach(([y, h], r) => {
    const evs = GRID_EV.filter(e => e.row === r && T0.grid + e.j * BEAT <= t);
    if (!evs.length) return;
    const cur = evs[evs.length - 1], prev = evs[evs.length - 2];
    const k = E.inOutQuint(seg(t, T0.grid + cur.j * BEAT, T0.grid + cur.j * BEAT + .5));
    /* exit: rows slide away alternately on the last beat */
    const ek = E.inOutQuint(seg(t, out + r * .08, out + .55 + r * .08)), ex = (r % 2 ? 1 : -1) * LW * ek;
    b.save(); b.translate(ex, 0); b.beginPath(); b.rect(0, y, LW, h); b.clip();
    if (prev) rowContent(b, prev, y, h, t);
    b.translate(cur.dir * LW * (1 - k), 0); rowContent(b, cur, y, h, t);
    b.restore();
  });
  /* hairlines between rows */
  b.fillStyle = 'rgba(30,32,35,.25)'; b.fillRect(0, 300, LW, 1); b.fillRect(0, 660, LW, 1);
}

function sceneLogo(t) {
  b.fillStyle = P.fog; b.fillRect(0, 0, LW, LH);
  lightLeak(t, T0.logo + 1.2, T0.contact + 1.5, .35);
  const cy = 380;
  /* monogram circle draws itself */
  const ck = E.inOutCubic(seg(t, T0.logo + .1, T0.logo + 1.3));
  b.strokeStyle = P.ink; b.lineWidth = 1.2; b.beginPath(); b.arc(270, cy, 78, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ck); b.stroke();
  const kk = E.outCubic(seg(t, T0.logo + .8, T0.logo + 1.6));
  b.save(); b.globalAlpha = kk; b.fillStyle = P.ink; b.font = it(500, 118); b.textAlign = 'center'; b.textBaseline = 'middle'; b.fillText('k', 270, cy - 8 + (1 - kk) * 8);
  b.fillStyle = P.apricot; b.beginPath(); b.arc(318, cy + 36, 5, 0, 7); b.fill(); b.restore();
  const wk = E.outCubic(seg(t, T0.logo + 1.4, T0.logo + 2.2));
  b.save(); b.globalAlpha = wk; b.textAlign = 'center'; b.fillStyle = P.ink; b.font = it(500, 66); b.fillText('keishi', 270, 548 + (1 - wk) * 10);
  b.font = mono(400, 11); b.fillStyle = P.ink2; const w = spacedW(b, 'CREATIVE STUDIO', 4.5); b.textAlign = 'left'; spaced(b, 'CREATIVE STUDIO', 270 - w / 2, 580, 4.5); b.restore();
  /* the opening line returns, small, as a signature */
  b.fillStyle = P.ink; b.font = jp(600, 20);
  vtext(b, SENT, 486, 176, 20, i => E.outCubic(seg(t, T0.logo + 2.0 + i * .08, T0.logo + 2.5 + i * .08)));
  b.fillRect(270 - 20, 640, 40 * E.inOutCubic(seg(t, T0.logo + 2.2, T0.logo + 3)), 1);
  /* contact */
  const c1 = E.outCubic(seg(t, T0.contact + .1, T0.contact + .8)), c2 = E.outCubic(seg(t, T0.contact + .4, T0.contact + 1.1));
  b.save(); b.textAlign = 'center';
  b.globalAlpha = c1; b.font = it(400, 24); b.fillStyle = P.ink; b.fillText('Portfolio & Contact', 270, 730 + (1 - c1) * 8);
  b.globalAlpha = c2; b.font = mono(400, 18); b.fillText('@keishi_studio', 270, 770 + (1 - c2) * 8);
  b.font = jp(600, 14); b.fillStyle = P.ink2; b.fillText('DMでお気軽にどうぞ', 270, 804 + (1 - c2) * 8);
  b.restore();
  captions(t, P.ink2);
  const fade = E.inOutCubic(seg(t, T0.fade, DUR));
  if (fade > 0) { b.fillStyle = `rgba(229,231,232,${fade})`; b.fillRect(0, 0, LW, LH); }
}

/* ================= frame ================= */
function renderScene(t) {
  b.setTransform(S, 0, 0, S, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'source-over'; b.textAlign = 'left'; b.textBaseline = 'alphabetic';
  if (t < T0.iris) sceneOpening(t);
  else if (t < T0.pause - .25) sceneIrisAndSpreads(t);
  else if (t < T0.grid) scenePause(t);
  else if (t < T0.logo) sceneGrid(t);
  else sceneLogo(t);
}
function compose(t) {
  const W = cv.width, H = cv.height, f = frameOf(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  /* gate weave: the frame drifts by a fraction of a pixel */
  const wx = (hash(f * 1.7) - .5) * .7 * S, wy = (hash(f * 2.3) - .5) * .7 * S;
  ctx.fillStyle = P.fog; ctx.fillRect(0, 0, W, H); ctx.drawImage(buf, wx, wy);
  /* halation: a soft warm glow around bright areas */
  if (HAS_FILTER) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .12; ctx.filter = `blur(${10 * S}px)`; ctx.drawImage(buf, 0, 0); ctx.restore(); ctx.filter = 'none'; }
  /* film grade: warm cast, lifted blacks */
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(229,154,111,.14)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighten'; ctx.fillStyle = 'rgb(38,35,38)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(vignette, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .09; ctx.fillStyle = ctx.createPattern(grains[f % 6], 'repeat'); ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  /* the odd speck of dust */
  if (hash(f * 9.1) > .82) {
    ctx.fillStyle = 'rgba(40,34,34,.5)'; const x = hash(f * 3.3) * W, y = hash(f * 5.7) * H;
    ctx.beginPath(); ctx.ellipse(x, y, (1 + hash(f) * 2) * S, (.6 + hash(f + 1)) * S, hash(f + 2) * 3, 0, 7); ctx.fill();
  }
}
let T = 0;
function render(t) { T = t; if (!cv.width || !grains.length || !silCv) return; renderScene(t); compose(t); updateUi(); }
window.renderAt = t => render(clamp(t, 0, DUR - 1e-4));
window.DUR = DUR; window.FPS = FPS;

/* ================= transport + sound ================= */
const TOC = [[T0.hook, 'i', 'Opening', '「言」の一文字から引いていく'], [T0.iris, 'ii', 'Works', '4つの見開きを、2拍ずつ'], [T0.pause, 'iii', 'Interlude', '思いついたら、もう、かたち。'], [T0.grid, 'iv', 'Grid', '1拍ごとに1段ずつ差し替え'], [T0.logo, 'v', 'Signature', 'ロゴと署名、連絡先']];
$('toc').innerHTML = TOC.map(([t, n, h, d]) => `<li><button data-t="${t}"><span class="n">${n}</span><span><b>${h}</b><span class="d">${d}</span></span><span class="t">${t.toFixed(1)}s</span></button></li>`).join('');
const track = $('track');
let playing = false, last = 0, soundOn = true, userStarted = false;
function updateUi() {
  $('seek').value = T; $('tc').innerHTML = `${T.toFixed(2)} <small>/ ${DUR.toFixed(2)} s · bar ${Math.floor(T / BAR) + 1}.${Math.floor((T % BAR) / BEAT) + 1}</small>`;
  let on = 0; TOC.forEach(([t], i) => { if (T >= t) on = i; });
  document.querySelectorAll('#toc li').forEach((li, i) => li.classList.toggle('on', i === on));
}
function syncAudio() {
  if (!track) return;
  if (!playing || !soundOn || !userStarted) { track.pause(); return; }
  if (Math.abs(track.currentTime - T) > .05) track.currentTime = T;
  track.play().catch(() => {});
}
function setPlaying(p) { playing = p; $('play').textContent = p ? '❚❚ Pause' : '▶ Play'; syncAudio(); if (p) { last = performance.now(); requestAnimationFrame(tick); } }
function tick(now) {
  if (!playing) return;
  const audioClock = track && track.src && soundOn && userStarted && !track.paused && track.readyState >= 2;
  let t = Math.max(0, audioClock ? track.currentTime : T + Math.max(0, now - last) / 1000); last = now;
  if (t >= DUR - 1e-3) { if ($('loop').checked) { t = 0; if (audioClock) track.currentTime = 0; } else { t = DUR - 1e-3; setPlaying(false); } }
  render(t); requestAnimationFrame(tick);
}
$('play').onclick = () => { userStarted = true; if (!playing && T >= DUR - .01) T = 0; setPlaying(!playing); };
$('snd').onclick = () => { soundOn = !soundOn; userStarted = true; $('snd').textContent = soundOn ? 'Sound on' : 'Sound off'; $('snd').setAttribute('aria-pressed', soundOn); syncAudio(); };
$('prev').onclick = () => { setPlaying(false); render(Math.max(0, (frameOf(T) - 1) / FPS)); };
$('next').onclick = () => { setPlaying(false); render(Math.min(DUR - 1e-3, (frameOf(T) + 1) / FPS)); };
$('seek').oninput = () => { setPlaying(false); render(+$('seek').value); };
document.querySelectorAll('#toc button').forEach(el => el.onclick = () => { setPlaying(false); render(+el.dataset.t + .02); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

/* ================= boot ================= */
function build() { buildSil(); }
new ResizeObserver(resize).observe(cv);
Promise.all([jp(800, 50), jp(600, 20), it(500, 50), it(400, 50), mono(400, 11)].map(f => document.fonts.load(f, 'Aa言葉'))).catch(() => {}).then(() => {
  build(); resize(); render(T0.logo + 4.2); window.__ready = true;
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => { if (!userStarted) { render(0); setPlaying(true); } }, 1200);
});
</script>
