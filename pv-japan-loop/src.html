<meta charset="utf-8">
<title>AIチャレンジ365 終わらない動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: the 9:16 player beside a ring of the fifteen stops; stacks on phones. Single committed dark look. */
:root {
  --night: #0b0b0d;
  --panel: #161618;
  --line: #2b2a2e;
  --paper: #f3ede2;
  --muted: #98918a;
  --gold: #e6c27a;
  --red: #d8432f;
  --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
  --brush: "Yuji Syuku", "Shippori Mincho B1", serif;
  color-scheme: dark;
}
html, body { background: var(--night); color: var(--paper); }
body { font-family: var(--mincho); padding-inline: 16px; padding-block: 24px 48px; line-height: 1.7; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
.screen { width: min(100%, calc(84vh * 9 / 16)); max-width: 100%; aspect-ratio: 9 / 16; background: #000; justify-self: center; }
.screen canvas { display: block; width: 100%; height: 100%; }
.side { display: grid; gap: 18px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .3em; color: var(--muted); }
h1 { font: 400 36px/1.3 var(--brush); margin: 4px 0 6px; }
h1 span { color: var(--gold); }
.lede { margin: 0; color: var(--muted); font-size: 14px; max-width: 42ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 13px var(--mincho); color: var(--paper); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button.primary { background: var(--gold); border-color: var(--gold); color: #1a1508; min-width: 92px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tc { font: 600 13px var(--mincho); font-variant-numeric: tabular-nums; }
.tc small { color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--gold); margin: 0; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.stops { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stops button { border-radius: 10px; padding: 8px 4px; display: grid; gap: 2px; text-align: center; font-size: 11px; }
.stops b { font: 400 17px var(--brush); }
.stops button.on { background: var(--gold); color: #1a1508; border-color: var(--gold); }
</style>

<div class="wrap">
  <div class="screen"><canvas id="cv" aria-label="AIチャレンジ365 終わらない動画"></canvas></div>
  <div class="side">
    <div>
      <div class="eyebrow">AIチャレンジ365 · 30秒 · 無限ループ</div>
      <h1>この動画、<br><span>終わりません。</span></h1>
      <p class="lede">カメラは一度も切り替わらず、ずっと前へ進み続けます。絵の中の丸いもの（太陽、茶碗、鈴、花火、提灯）が次の絵への窓になり、15枚目の先がまた1枚目につながります。</p>
    </div>
    <div class="row">
      <button class="primary" id="play">▶ 再生</button>
      <button id="snd" aria-pressed="true">音 あり</button>
      <button id="prev">‹ 1コマ</button>
      <button id="next">1コマ ›</button>
      <label class="chk"><input type="checkbox" id="loop" checked> くり返す</label>
    </div>
    <div class="row"><span class="tc" id="tc">0.00</span></div>
    <input type="range" id="seek" min="0" max="30" step="0.001" value="0" aria-label="再生位置">
    <div class="stops" id="stops"></div>
  </div>
</div>

<!--AUDIO-->
<script>
/* ================= utilities ================= */
const DUR = 30, FPS = 30, LW = 540, LH = 960, CX = LW / 2, CY = LH / 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = k => k * k * (3 - 2 * k);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const frameOf = t => Math.floor(t * FPS + 1e-6);
const $ = id => document.getElementById(id);
const mincho = (w, px) => `${w} ${px}px "Shippori Mincho B1", "Hiragino Mincho ProN", serif`;
const brushF = px => `400 ${px}px "Yuji Syuku", "Shippori Mincho B1", serif`;

/* ================= the chain of pictures =================
   each level shows its picture framed on `focus`; `portal` is the round thing in the
   picture that becomes the window into the next level (both in 0..1 picture coords). */
const LEVELS = [
  { key: 'koi', name: '鯉', focus: [.52, .45], portal: [.5, .56] },
  { key: 'cranes', name: '折り鶴', focus: [.86, .3], portal: [.915, .13] },
  { key: 'fuji', name: '富士', focus: [.8, .32], portal: [.86, .225] },
  { key: 'momiji', name: '紅葉', focus: [.78, .3], portal: [.795, .15] },
  { key: 'torii', name: '鳥居', focus: [.2, .3], portal: [.18, .145] },
  { key: 'matcha', name: '抹茶', focus: [.68, .48], portal: [.69, .44] },
  { key: 'sushi', name: '寿司', focus: [.22, .35], portal: [.17, .2] },
  { key: 'maneki', name: '招き猫', focus: [.5, .5], portal: [.525, .535] },
  { key: 'festival', name: '花火', focus: [.64, .3], portal: [.645, .15] },
  { key: 'street', name: '夕焼け', focus: [.78, .42], portal: [.8, .33] },
  { key: 'taiko', name: '太鼓', focus: [.6, .55], portal: [.77, .6] },
  { key: 'samurai', name: '侍', focus: [.7, .42], portal: [.73, .4] },
  { key: 'onsen', name: '湯', focus: [.3, .45], portal: [.165, .39] },
  { key: 'bamboo', name: '竹林', focus: [.4, .45], portal: [.33, .5] },
  { key: 'indigo', name: '藍', focus: [.53, .45], portal: [.53, .42] },
];
const NL = LEVELS.length, SEG = DUR / NL;   // 2 s per picture = one bar at 120 BPM
const F = 3;                               // zoom factor from one picture to the next
const PR = 90;                             // portal radius in a picture's own frame (= LW / F / 2)
const MESSAGES = [
  { a: 26.6, b: 33.4, lines: ['この動画、', '終わりません。'] },
  { a: 7.2, b: 12.4, lines: ['気づいたら、', 'もう何枚目？'] },
  { a: 14.2, b: 19.6, lines: ['ぜんぶ、', 'AIで描いた。'] },
  { a: 20.6, b: 26.0, logo: true },
];
const CUES = { bpm: 120, seg: SEG, levels: NL, end: DUR, portals: LEVELS.map((_, i) => i * SEG + SEG * .18), messages: MESSAGES.map(m => m.a % DUR) };
window.CUES = CUES;

/* ================= pictures ================= */
const IMGS = /*IMGS*/{};
const IM = {};
function loadImages() {
  return Promise.all(Object.entries(IMGS).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = () => { IM[k] = im; res(); }; im.onerror = res; im.src = src; })));
}
/* placement of a picture in its level frame: cover the frame, centred on focus, clamped */
function placement(L) {
  const im = IM[L.key], k = Math.max(LW / im.width, LH / im.height), w = im.width * k, h = im.height * k;
  const x = clamp(CX - L.focus[0] * w, LW - w, 0), y = clamp(CY - L.focus[1] * h, LH - h, 0);
  return { x, y, w, h };
}
let GEO = [];
function buildGeometry() {
  GEO = LEVELS.map(L => {
    const p = placement(L), q = [p.x + L.portal[0] * p.w, p.y + L.portal[1] * p.h];
    /* keep the whole portal inside the frame */
    q[0] = clamp(q[0], PR + 10, LW - PR - 10); q[1] = clamp(q[1], PR + 10, LH - PR - 10);
    /* zoom about the fixed point c so that the portal's frame grows to fill the screen */
    const c = [(F * q[0] - CX) / (F - 1), (F * q[1] - CY) / (F - 1)];
    return { p, q, c };
  });
}

/* ================= canvases ================= */
const cv = $('cv'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'), b = buf.getContext('2d');
let S = 1, grains = [];
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(Math.round(cv.clientWidth * d), 1080);
  if (!w) return;
  const h = Math.round(w * 16 / 9);
  for (const c of [cv, buf]) { c.width = w; c.height = h; }
  S = w / LW;
  grains = [0, 1, 2].map(k => { const c = document.createElement('canvas'); c.width = c.height = 150; const g = c.getContext('2d'), im = g.createImageData(150, 150); for (let i = 0; i < im.data.length; i += 4) { const v = hash(i * .43 + k * 61) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; });
  render(T);
}

/* ================= the endless zoom ================= */
function drawPicture(g, i) { const L = LEVELS[i], p = GEO[i].p; g.imageSmoothingQuality = 'high'; g.drawImage(IM[L.key], p.x, p.y, p.w, p.h); }
/* window shape in level-i coords: a circle that stretches into the next picture's full frame */
function portalPath(g, q, k) {
  const s = smooth(seg(k, .45, 1)), hw = PR, hh = lerp(PR, LH / F / 2, s), r = lerp(PR, 0, s);
  g.beginPath(); g.roundRect(q[0] - hw, q[1] - hh, hw * 2, hh * 2, r);
}
function drawLevel(g, i, k, t) {
  const G = GEO[i], z = Math.pow(F, k), n = (i + 1) % NL;
  g.save();
  g.translate(G.c[0], G.c[1]); g.scale(z, z); g.translate(-G.c[0], -G.c[1]);
  drawPicture(g, i);
  const a = smooth(seg(k, .06, .3));
  if (a > 0) {
    /* glow around the opening window, fading as it fills the screen */
    const ringA = a * (1 - smooth(seg(k, .6, .95)));
    g.save(); g.shadowColor = 'rgba(255,215,140,.9)'; g.shadowBlur = 26 * S; portalPath(g, G.q, k); g.fillStyle = `rgba(255,225,170,${.35 * ringA})`; g.fill(); g.restore();
    g.save(); portalPath(g, G.q, k); g.clip();
    g.globalAlpha = a;
    g.translate(G.q[0], G.q[1]); g.scale(1 / F, 1 / F); g.translate(-CX, -CY);
    drawPicture(g, n);
    g.restore();
    g.save(); portalPath(g, G.q, k); g.strokeStyle = `rgba(255,236,196,${.85 * ringA})`; g.lineWidth = 2.2 / z; g.stroke(); g.restore();
  }
  g.restore();
}

/* ================= atmosphere: gold dust drifting in, periodic over the loop ================= */
const DUST = Array.from({ length: 70 }, (_, i) => ({ a: hash(i) * 6.283, r0: hash(i + 40), sp: .5 + hash(i + 80), sz: .6 + hash(i + 120) * 1.8 }));
function dust(g, t) {
  g.save(); g.globalCompositeOperation = 'screen';
  for (const d of DUST) {
    const u = ((d.r0 + t / 10 * Math.round(d.sp * 2 + 1)) % 1);   // whole cycles per 30 s keep the loop seamless
    const r = 40 + Math.pow(u, 1.6) * 700, a = d.a + t * 2 * Math.PI / 30;
    const x = CX + Math.cos(a) * r, y = CY + Math.sin(a) * r * 1.25;
    g.fillStyle = `rgba(255,226,170,${.55 * Math.sin(Math.PI * u)})`; g.beginPath(); g.arc(x, y, d.sz * (.5 + u), 0, 7); g.fill();
  }
  g.restore();
}

/* ================= words ================= */
function wrapT(t, a) { let u = t - a; if (u < -DUR / 2) u += DUR; return u; }
function messages(g, t) {
  for (const m of MESSAGES) {
    const len = m.b - m.a, u = ((t - m.a) % DUR + DUR) % DUR;
    if (u > len) continue;
    const kin = smooth(seg(u, 0, .6)), kout = 1 - smooth(seg(u, len - .6, len)), a = Math.min(kin, kout);
    if (a <= 0) continue;
    g.save(); g.globalAlpha = a;
    if (m.logo) {
      const sc = g.createRadialGradient(CX, 470, 40, CX, 470, 330); sc.addColorStop(0, 'rgba(8,8,10,.62)'); sc.addColorStop(1, 'rgba(8,8,10,0)');
      g.fillStyle = sc; g.fillRect(0, 100, LW, 760);
      g.fillStyle = '#d8432f'; g.beginPath(); g.arc(CX, 400, 74, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.font = brushF(76); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('AI', CX, 404);
      g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 14 * S;
      g.font = mincho(800, 44); g.fillText('AIチャレンジ365', CX, 540);
      g.font = mincho(600, 22); g.fillStyle = '#f3ede2'; g.fillText('毎日、AIで描く。', CX, 600);
      g.fillStyle = '#e6c27a'; g.fillText('プロフィールのリンクから', CX, 650);
    } else {
      const sc = g.createLinearGradient(0, 70, 0, 380); sc.addColorStop(0, 'rgba(8,8,10,.6)'); sc.addColorStop(1, 'rgba(8,8,10,0)');
      g.fillStyle = sc; g.fillRect(0, 60, LW, 330);
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 16 * S;
      g.font = mincho(800, 40); g.fillText(m.lines[0], CX, 170);
      g.font = brushF(58); g.fillText(m.lines[1], CX, 250);
    }
    g.restore();
  }
}
function counter(g, t) {
  const i = Math.floor(t / SEG) % NL, k = (t % SEG) / SEG;
  g.save(); g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 10 * S;
  g.font = mincho(800, 20); g.fillStyle = '#fff'; g.fillText(String(i + 1).padStart(2, '0'), CX - 24, 900);
  g.font = mincho(600, 14); g.fillStyle = 'rgba(255,255,255,.65)'; g.fillText('/ 15', CX + 16, 900);
  g.font = mincho(600, 14); g.fillStyle = '#e6c27a'; g.fillText(LEVELS[i].name, CX, 928);
  /* fifteen dots, the current one filling up */
  for (let j = 0; j < NL; j++) {
    const x = CX - 7 * 14 + j * 14, on = j === i;
    g.fillStyle = on ? '#e6c27a' : j < i ? 'rgba(230,194,122,.55)' : 'rgba(255,255,255,.28)';
    g.beginPath(); g.arc(x, 872, on ? 3 + 1.5 * k : 2.4, 0, 7); g.fill();
  }
  g.restore();
}

/* ================= frame ================= */
function scene(g, t) {
  g.setTransform(S, 0, 0, S, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#000'; g.fillRect(0, 0, LW, LH);
  const tt = ((t % DUR) + DUR) % DUR, i = Math.floor(tt / SEG) % NL, k = (tt - i * SEG) / SEG;
  drawLevel(g, i, k, tt);
  dust(g, tt);
  messages(g, tt);
  counter(g, tt);
}
function compose(t) {
  const W = cv.width, H = cv.height, f = frameOf(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.drawImage(buf, 0, 0);
  if ('filter' in ctx) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .16; ctx.filter = `blur(${12 * S}px)`; ctx.drawImage(buf, 0, 0); ctx.restore(); ctx.filter = 'none'; }
  /* tunnel vignette pulls the eye to the centre */
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .22, W / 2, H / 2, H * .7); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07; ctx.fillStyle = ctx.createPattern(grains[f % 3], 'repeat'); ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
let T = 0;
function render(t) { T = t; if (!cv.width || !grains.length || !GEO.length) return; scene(b, t); compose(t); updateUi(); }
window.renderAt = t => render(clamp(t, 0, DUR - 1e-4));
window.DUR = DUR; window.FPS = FPS;

/* ================= transport + sound ================= */
$('stops').innerHTML = LEVELS.map((L, i) => `<button data-t="${i * SEG}"><b>${L.name}</b>${String(i + 1).padStart(2, '0')}</button>`).join('');
const track = $('track');
let playing = false, last = 0, soundOn = true, userStarted = false;
function updateUi() {
  $('seek').value = T; $('tc').innerHTML = `${T.toFixed(2)} <small>/ ${DUR.toFixed(2)} 秒</small>`;
  const i = Math.floor(T / SEG) % NL; document.querySelectorAll('#stops button').forEach((el, j) => el.classList.toggle('on', j === i));
}
function syncAudio() {
  if (!track) return;
  if (!playing || !soundOn || !userStarted) { track.pause(); return; }
  if (Math.abs(track.currentTime - T) > .05) track.currentTime = T;
  track.play().catch(() => {});
}
function setPlaying(p) { playing = p; $('play').textContent = p ? '❚❚ 止める' : '▶ 再生'; syncAudio(); if (p) { last = performance.now(); requestAnimationFrame(tick); } }
function tick(now) {
  if (!playing) return;
  const audioClock = track && track.src && soundOn && userStarted && !track.paused && track.readyState >= 2;
  let t = Math.max(0, audioClock ? track.currentTime : T + Math.max(0, now - last) / 1000); last = now;
  if (t >= DUR - 1e-3) { if ($('loop').checked) { t = 0; if (audioClock) track.currentTime = 0; } else { t = DUR - 1e-3; setPlaying(false); } }
  render(t); requestAnimationFrame(tick);
}
$('play').onclick = () => { userStarted = true; if (!playing && T >= DUR - .01) T = 0; setPlaying(!playing); };
$('snd').onclick = () => { soundOn = !soundOn; userStarted = true; $('snd').textContent = soundOn ? '音 あり' : '音 なし'; $('snd').setAttribute('aria-pressed', soundOn); syncAudio(); };
$('prev').onclick = () => { setPlaying(false); render(Math.max(0, (frameOf(T) - 1) / FPS)); };
$('next').onclick = () => { setPlaying(false); render(Math.min(DUR - 1e-3, (frameOf(T) + 1) / FPS)); };
$('seek').oninput = () => { setPlaying(false); render(+$('seek').value); };
document.querySelectorAll('#stops button').forEach(el => el.onclick = () => { setPlaying(false); render(+el.dataset.t + SEG * .55); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

/* ================= boot ================= */
function build() {}
new ResizeObserver(resize).observe(cv);
Promise.all([loadImages(), ...[mincho(800, 40), brushF(58)].map(f => document.fonts.load(f, 'この動画終わりませんぜんぶAIで描いたチャレンジ365気づいたらもう何枚目'))]).catch(() => {}).then(() => {
  buildGeometry(); resize(); render(SEG * 5 + SEG * .55); window.__ready = true;
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => { if (!userStarted) { render(0); setPlaying(true); } }, 1200);
});
</script>
