type: tips
episode: 11
hook: "買った家で\n*雨漏り*…\n誰が直すの？"
sub: "「契約不適合責任」の話"
points:
  - title: "原則は"
    body: "契約内容と違う不具合は\n売主に*修理や減額*などを\n請求できる"
  - title: "ただし中古は"
    body: "個人の売主だと\n*責任を免除*する特約が\nついていることも多い"
  - title: "対策"
    body: "*インスペクション*\n(建物状況調査)で\n買う前に状態を確認"
conclusion: "契約書の\n*特約*は必ず読もう"
caption: |
  中古住宅は「契約不適合責任」の特約をチェック！
  不安な方は購入前にインスペクション（建物状況調査）も検討を🔍
hashtags: [契約不適合責任, インスペクション, 中古戸建, 家探し, 不動産, 家を買う前に]
