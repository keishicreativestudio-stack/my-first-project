type: tips
episode: 10
hook: "家が建っていると\n土地の税金が\n*6分の1*になる"
sub: "固定資産税の特例の話"
points:
  - title: "住宅用地の特例"
    body: "住宅の敷地は\n*200㎡まで*の部分の\n固定資産税が1/6に"
  - title: "空き家は注意"
    body: "管理されない空き家は\n勧告を受けると\n*特例が外れる*ことも"
  - title: "買う前に"
    body: "毎年いくらかかるか\n*税額*を担当者に確認"
conclusion: "買った後の\n*ランニングコスト*も大事"
caption: |
  住宅が建っている土地は固定資産税が安くなる特例があります（200㎡まで1/6）。
  購入後の税金も事前に確認しておきましょう。
hashtags: [固定資産税, 税金, 家探し, 空き家, 不動産, 家を買う前に]
