<meta charset="utf-8">
<title>AIチャレンジ365 清</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: the 9:16 player on white washi, a vertical list of the seven scenes beside it; stacks on phones. Single committed light look. */
:root {
  --washi: #f7f4ee;
  --paper: #fbfaf6;
  --sumi: #2a2927;
  --sumi-2: #85817a;
  --line: #dcd6cb;
  --shu: #c8432f;
  --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  color-scheme: light;
}
html, body { background: var(--washi); color: var(--sumi); }
body { font-family: var(--mincho); padding-inline: 16px; padding-block: 28px 48px; line-height: 1.8; }
.wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
.screen { width: min(100%, calc(84vh * 9 / 16)); max-width: 100%; aspect-ratio: 9 / 16; background: var(--paper); justify-self: center; box-shadow: 0 20px 50px -30px rgba(42, 41, 39, .35); }
.screen canvas { display: block; width: 100%; height: 100%; }
.side { display: grid; gap: 20px; min-width: 0; }
.title { display: flex; gap: 20px; align-items: flex-start; }
.title h1 { writing-mode: vertical-rl; font: 600 30px/1.4 var(--mincho); margin: 0; letter-spacing: .2em; }
.title p { margin: 0; font-size: 14px; color: var(--sumi-2); max-width: 36ch; }
.seal { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--shu); color: #fff; font: 600 13px var(--mincho); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 13px var(--mincho); color: var(--sumi); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
button:hover { border-color: var(--sumi); }
button.primary { background: var(--sumi); border-color: var(--sumi); color: var(--paper); min-width: 92px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }
.tc { font: 600 13px var(--mincho); font-variant-numeric: tabular-nums; }
.tc small { color: var(--sumi-2); }
input[type=range] { width: 100%; accent-color: var(--sumi); margin: 0; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--sumi-2); }
ol.scenes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; border-block: 1px solid var(--line); padding-block: 12px; overflow-x: auto; }
ol.scenes button { all: unset; cursor: pointer; writing-mode: vertical-rl; padding: 6px 8px; min-height: 150px; font-size: 14px; letter-spacing: .15em; border-radius: 2px; }
ol.scenes button:focus-visible { outline: 2px solid var(--shu); }
ol.scenes .n { color: var(--shu); margin-bottom: 8px; }
ol.scenes li.on button { background: var(--sumi); color: var(--paper); }
</style>

<div class="wrap">
  <div class="screen"><canvas id="cv" aria-label="AIチャレンジ365 清らかな日本"></canvas></div>
  <div class="side">
    <div class="title">
      <h1>澄んだ水に</h1>
      <div style="display:grid;gap:10px">
        <span class="seal" aria-hidden="true">AI</span>
        <p>余白と水と光で組んだ、清らかな30秒。掛け軸のような縦長の枠に、静かな絵を七つ。一滴の水紋から始まり、霧の鳥居へ抜けていきます。</p>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="play">▶ 再生</button>
      <button id="snd" aria-pressed="true">音 あり</button>
      <button id="prev">‹ 一コマ</button>
      <button id="next">一コマ ›</button>
      <label class="chk"><input type="checkbox" id="loop" checked> 繰り返す</label>
    </div>
    <div class="row"><span class="tc" id="tc">0.00</span></div>
    <input type="range" id="seek" min="0" max="30" step="0.001" value="0" aria-label="再生位置">
    <ol class="scenes" id="scenes"></ol>
  </div>
</div>

<!--AUDIO-->
<script>
/* ================= utilities ================= */
const DUR = 30, FPS = 30, LW = 540, LH = 960;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = k => k * k * (3 - 2 * k);
const ease = k => -(Math.cos(Math.PI * k) - 1) / 2;
const outC = k => 1 - Math.pow(1 - k, 3);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const frameOf = t => Math.floor(t * FPS + 1e-6);
const $ = id => document.getElementById(id);
const mincho = (w, px) => `${w} ${px}px "Shippori Mincho B1", "Hiragino Mincho ProN", serif`;
const INK = '#2a2927', INK2 = '#85817a', SHU = '#c8432f';

/* ================= the scroll frame ================= */
const FR = { x: 44, y: 116, w: 360, h: 736 };      // tall like a hanging scroll; the right margin holds the words
const TX = 472;                                     // centre of the text column

/* ================= scenes ================= */
const SC = [
  { t: 0, key: 'koi', from: [.5, .5, 1.12], to: [.5, .45, 1.0], fx: 'water', line: '澄んだ水に', n: '一', tr: 'drop' },
  { t: 5.5, key: 'bamboo', from: [.5, .62, 1.0], to: [.5, .5, 1.1], fx: 'light', line: 'やわらかな光', n: '二', tr: 'light' },
  { t: 10, key: 'cranes', from: [.5, .62, 1.35], to: [.46, .6, 1.2], fx: 'none', line: '白の、静けさ', n: '三', tr: 'mist' },
  { t: 13.5, key: 'fuji', from: [.56, .42, 1.12], to: [.62, .42, 1.2], fx: 'petals', line: '遠い、春', n: '四', tr: 'mist' },
  { t: 17, key: 'matcha', from: [.67, .52, 1.25], to: [.68, .48, 1.1], fx: 'steam', line: 'ひと息の、みどり', n: '五', tr: 'drop' },
  { t: 20.5, key: 'onsen', from: [.5, .58, 1.12], to: [.5, .46, 1.0], fx: 'snow', line: '湯けむりの、朝', n: '六', tr: 'drop' },
  { t: 24, key: 'torii', from: [.66, .56, 1.0], to: [.665, .5, 1.55], fx: 'mist', line: ['筆もカメラも、', '使わずに。'], n: '七', tr: 'light' },
];
const END = 27, TRD = 1.3;
const CUES = {
  bpm: 60, end: DUR, scenes: SC.map(s => s.t), drops: [0.55, ...SC.filter((s, i) => i && s.tr === 'drop').map(s => s.t - TRD + .35)],
  lights: SC.filter((s, i) => i && s.tr !== 'drop').map(s => s.t - TRD), logo: END, seal: END + 1.0,
};
window.CUES = CUES;

/* ================= pictures ================= */
const IMGS = /*IMGS*/{};
const IM = {};
function loadImages() {
  return Promise.all(Object.entries(IMGS).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = () => { IM[k] = im; res(); }; im.onerror = res; im.src = src; })));
}
function placeIn(key, cx, cy, z) {
  const im = IM[key], k = Math.max(FR.w / im.width, FR.h / im.height) * z, w = im.width * k, h = im.height * k;
  return { x: FR.x + clamp(FR.w / 2 - cx * w, FR.w - w, 0), y: FR.y + clamp(FR.h / 2 - cy * h, FR.h - h, 0), w, h };
}
function drawScene(g, i, t) {
  const s = SC[i], next = SC[i + 1], end = next ? next.t : END + .6, k = ease(clamp((t - s.t + TRD) / (end - s.t + TRD)));
  const cx = lerp(s.from[0], s.to[0], k), cy = lerp(s.from[1], s.to[1], k), z = lerp(s.from[2], s.to[2], k);
  const p = placeIn(s.key, cx, cy, z), im = IM[s.key];
  g.save(); g.beginPath(); g.rect(FR.x, FR.y, FR.w, FR.h); g.clip();
  if (s.fx === 'water') {
    /* the pond surface breathes: thin strips shifted by slow waves */
    const n = 90, sh = FR.h / n, sy = im.height / p.h;
    for (let j = 0; j < n; j++) { const y = FR.y + j * sh, dx = Math.sin(y * .05 + t * 1.8) * 1.8 + Math.sin(y * .017 - t * 1.1) * 1.4; g.drawImage(im, 0, (y - p.y) * sy, im.width, (sh + 1) * sy, p.x + dx, y, p.w, sh + 1); }
  } else g.drawImage(im, p.x, p.y, p.w, p.h);
  fx(g, s.fx, t - s.t + TRD, i);
  g.restore();
}

/* semi-transparent scene: render at full strength off-screen first so the water strips never double up */
const ghost = document.createElement('canvas'), gh = ghost.getContext('2d');
function drawSceneA(g, i, t, a) {
  if (a >= .999) { drawScene(g, i, t); return; }
  if (a <= 0) return;
  if (ghost.width !== cv.width) { ghost.width = cv.width; ghost.height = cv.height; }
  gh.setTransform(1, 0, 0, 1, 0, 0); gh.clearRect(0, 0, ghost.width, ghost.height); gh.setTransform(S, 0, 0, S, 0, 0);
  drawScene(gh, i, t);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.drawImage(ghost, 0, 0); g.restore();
}

/* ================= gentle particles ================= */
const PT = Array.from({ length: 50 }, (_, i) => ({ x: hash(i), y: hash(i + 50), z: .3 + hash(i + 100) * .7, r: hash(i + 150) * 6.28 }));
function fx(g, kind, u, seed) {
  if (kind === 'petals' || kind === 'snow') {
    for (const p of PT.slice(0, kind === 'snow' ? 50 : 22)) {
      const y = FR.y + ((p.y * FR.h + u * (kind === 'snow' ? 22 : 40) * (.5 + p.z)) % (FR.h + 20)) - 10;
      const x = FR.x + p.x * FR.w + Math.sin(u * (kind === 'snow' ? .7 : 1.1) + p.r) * 18 * p.z;
      g.save(); g.translate(x, y); g.globalAlpha = .35 + .55 * p.z;
      if (kind === 'snow') { g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, .8 + 1.8 * p.z, 0, 7); g.fill(); }
      else { g.rotate(p.r + u * (.8 + p.z)); g.scale(1, .5 + .5 * Math.sin(u * 2 + p.r)); g.fillStyle = '#f5c9d1'; g.beginPath(); g.ellipse(0, 0, 3 + 5 * p.z, 2 + 3 * p.z, 0, 0, 7); g.fill(); }
      g.restore();
    }
  } else if (kind === 'light') {
    g.save(); g.globalCompositeOperation = 'screen';
    for (let i = 0; i < 6; i++) {
      const a = 1.25 + (i - 2.5) * .08 + Math.sin(u * .4 + i) * .015, ox = FR.x + 110, oy = FR.y - 30, L = 900;
      const gr = g.createLinearGradient(ox, oy, ox + Math.cos(a) * L, oy + Math.sin(a) * L);
      gr.addColorStop(0, `rgba(255,250,230,${.2 + .07 * Math.sin(u * 1.1 + i * 2)})`); gr.addColorStop(1, 'rgba(255,250,230,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.cos(a - .03) * L, oy + Math.sin(a - .03) * L); g.lineTo(ox + Math.cos(a + .03) * L, oy + Math.sin(a + .03) * L); g.fill();
    }
    for (const p of PT) { const x = FR.x + ((p.x * FR.w + u * 6 * p.z) % FR.w), y = FR.y + ((p.y * FR.h - u * 9 * p.z + FR.h) % FR.h); g.fillStyle = `rgba(255,248,220,${.35 * p.z * (.5 + .5 * Math.sin(u * 2 + p.r))})`; g.beginPath(); g.arc(x, y, .7 + 1.4 * p.z, 0, 7); g.fill(); }
    g.restore();
  } else if (kind === 'steam' || kind === 'mist') {
    g.save();
    for (let i = 0; i < 9; i++) {
      const p = PT[i], x = FR.x + p.x * FR.w + Math.sin(u * .4 + i) * 30, y = FR.y + FR.h * (kind === 'steam' ? .45 : .35 + p.y * .6) - u * (12 + 18 * p.z), r = 110 + 90 * p.z;
      const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,255,255,${kind === 'steam' ? .2 : .16 + .2 * clamp(u / 4)})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.restore();
  }
  if (kind === 'snow') fx(g, 'steam', u, seed);
}

/* ================= transitions ================= */
const tmp = document.createElement('canvas'), tg = tmp.getContext('2d');
function rippleReveal(g, drawB, cx, cy, k, t) {
  /* B appears inside a soft circle that spreads like a ring on water */
  const R = 40 + 820 * outC(k);
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, tmp.width, tmp.height); tg.setTransform(S, 0, 0, S, 0, 0);
  drawB(tg);
  tg.globalCompositeOperation = 'destination-in';
  const gr = tg.createRadialGradient(cx, cy, Math.max(0, R - 70), cx, cy, R); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  tg.fillStyle = gr; tg.fillRect(0, 0, LW, LH); tg.globalCompositeOperation = 'source-over';
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(tmp, 0, 0); g.restore();
  /* the rings themselves */
  g.save(); g.beginPath(); g.rect(FR.x, FR.y, FR.w, FR.h); g.clip();
  for (let j = 0; j < 3; j++) {
    const kk = clamp(k * 1.25 - j * .12); if (kk <= 0 || kk >= 1) continue;
    const r = 30 + 700 * outC(kk);
    g.strokeStyle = `rgba(255,255,255,${.55 * (1 - kk)})`; g.lineWidth = 2.5 * (1 - kk) + .5;
    g.beginPath(); g.ellipse(cx, cy, r, r * .92, 0, 0, 7); g.stroke();
  }
  g.restore();
}
function drop(g, x, y0, y1, k) {
  /* a single falling drop, stretching as it speeds up */
  const e = k * k, y = lerp(y0, y1, e), st = 1 + e * 1.4;
  g.save(); g.fillStyle = 'rgba(120,150,170,.75)'; g.beginPath(); g.ellipse(x, y, 4.5, 4.5 * st, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(x - 1.2, y - 1.5 * st, 1.4, 0, 7); g.fill(); g.restore();
}

/* ================= paper, words ================= */
let washi = null;
function buildWashi() {
  washi = document.createElement('canvas'); washi.width = cv.width; washi.height = cv.height;
  const g = washi.getContext('2d'); g.scale(S, S); g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, LW, LH);
  for (let i = 0; i < 22; i++) { const x = hash(i * 3) * LW, y = hash(i * 5) * LH, r = 80 + hash(i) * 140, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(230,220,200,.12)'); gr.addColorStop(1, 'rgba(230,220,200,0)'); g.fillStyle = gr; g.fillRect(0, 0, LW, LH); }
  g.lineCap = 'round';
  for (let i = 0; i < 360; i++) { const x = hash(i * 3.1) * LW, y = hash(i * 7.7) * LH, a = hash(i * 1.3) * 6.28, l = 6 + hash(i * 5.5) * 30; g.strokeStyle = `rgba(170,155,130,${.05 + hash(i * 2.2) * .08})`; g.lineWidth = .3 + hash(i) * .5; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
}
function vcol(g, s, x, y, px, t0, t, a = 1) {
  g.save(); g.font = mincho(600, px); g.fillStyle = INK; g.textAlign = 'center'; g.textBaseline = 'middle';
  [...s].forEach((c, i) => {
    const k = sm(seg(t, t0 + i * .12, t0 + i * .12 + .9)); if (k <= 0) return;
    let cx = x, cy = y + i * px * 1.25 + px / 2; if ('、。'.includes(c)) { cx += px * .55; cy -= px * .55; }
    g.globalAlpha = a * k; g.fillText(c, cx, cy + (1 - k) * 6);
  });
  g.restore();
}
function margins(g, t) {
  const i = sceneAt(t), s = SC[i], u = t - s.t, out = i < SC.length - 1 ? 1 - sm(seg(t, SC[i + 1].t - TRD, SC[i + 1].t - TRD * .4)) : 1 - sm(seg(t, END - .8, END - .1));
  if (Array.isArray(s.line)) { vcol(g, s.line[0], TX + 20, FR.y + 20, 26, s.t - .2, t, out); vcol(g, s.line[1], TX - 22, FR.y + 76, 26, s.t + .9, t, out); }
  else vcol(g, s.line, TX, FR.y + 20, 28, i === 0 ? -5 : s.t - .2, t, out);
  /* left: the scene numeral and a hairline that grows through the whole film */
  g.save(); g.font = mincho(600, 13); g.fillStyle = INK2; g.textAlign = 'center';
  g.globalAlpha = out; g.fillText(s.n, 22, FR.y + 10); g.globalAlpha = 1;
  g.fillStyle = 'rgba(42,41,39,.12)'; g.fillRect(21.5, FR.y + 28, 1, FR.h - 28);
  g.fillStyle = SHU; g.fillRect(21.5, FR.y + 28, 1, (FR.h - 28) * clamp(t / END));
  g.restore();
  /* bottom: the brand, very small, all the way through */
  g.save(); g.font = mincho(600, 12); g.fillStyle = INK2; g.textAlign = 'left'; g.fillText('AIチャレンジ365', FR.x, FR.y + FR.h + 34); g.restore();
}
function sceneAt(t) { let i = 0; SC.forEach((s, j) => { if (t >= s.t) i = j; }); return i; }

/* ================= the closing page ================= */
function closing(g, t) {
  const u = t - END;
  /* the frame empties to paper; one last drop lands in the middle */
  const cx = LW / 2, cy = 380;
  if (u < .6) drop(g, cx, 120, cy, u / .6);
  const rk = seg(u, .6, 3);
  for (let j = 0; j < 3; j++) { const kk = clamp(rk * 1.3 - j * .15); if (kk <= 0 || kk >= 1) continue; const r = 10 + 300 * outC(kk); g.strokeStyle = `rgba(130,160,180,${.5 * (1 - kk)})`; g.lineWidth = 1.5 * (1 - kk) + .4; g.beginPath(); g.ellipse(cx, cy, r, r * .35, 0, 0, 7); g.stroke(); }
  const sk = sm(seg(u, .9, 1.5));
  g.save(); g.globalAlpha = sk; g.fillStyle = SHU; g.beginPath(); g.arc(cx, cy, 34 * lerp(1.3, 1, sk), 0, 7); g.fill();
  g.fillStyle = '#fff'; g.font = mincho(800, 26); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('AI', cx, cy + 1); g.restore();
  vcol(g, 'AIで、描きました。', cx, 460, 28, END + 1.1, t);
  const bk = sm(seg(u, 2.0, 2.6));
  g.save(); g.globalAlpha = bk; g.textAlign = 'center'; g.fillStyle = INK; g.font = mincho(800, 30); g.fillText('AIチャレンジ365', cx, 860);
  g.font = mincho(600, 15); g.fillStyle = INK2; g.fillText('プロフィールのリンクから', cx, 896); g.restore();
}

/* ================= frame ================= */
const cv = $('cv'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'), b = buf.getContext('2d');
let S = 1, grains = [];
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(Math.round(cv.clientWidth * d), 1080);
  if (!w) return;
  const h = Math.round(w * 16 / 9);
  for (const c of [cv, buf, tmp]) { c.width = w; c.height = h; }
  S = w / LW;
  grains = [0, 1, 2].map(k => { const c = document.createElement('canvas'); c.width = c.height = 150; const g = c.getContext('2d'), im = g.createImageData(150, 150); for (let i = 0; i < im.data.length; i += 4) { const v = hash(i * .47 + k * 29) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; });
  buildWashi(); render(T);
}
function scene(g, t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.drawImage(washi, 0, 0);
  g.setTransform(S, 0, 0, S, 0, 0); g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  if (t >= END) { closing(g, t); const o = 1 - sm(seg(t, END, END + .8)); if (o > 0) { g.save(); drawSceneA(g, SC.length - 1, t, o); g.fillStyle = `rgba(251,250,246,${sm(seg(t, END - .8, END + .6))})`; g.fillRect(FR.x, FR.y, FR.w, FR.h); g.restore(); } return; }
  const i = sceneAt(t), nx = SC[i + 1];
  /* opening: the koi lies faint under the paper until the first drop lands */
  if (i === 0 && t < 2.6) {
    drawSceneA(g, 0, t, .28);
    g.fillStyle = 'rgba(251,250,246,.0)';
    if (t < .55) drop(g, FR.x + FR.w / 2, FR.y - 60, FR.y + FR.h * .5, t / .55);
    else rippleReveal(g, gg => drawScene(gg, 0, t), FR.x + FR.w / 2, FR.y + FR.h * .5, seg(t, .55, 2.6), t);
  } else drawScene(g, i, t);
  /* outgoing into the next scene */
  if (nx && t > nx.t - TRD) {
    const k = seg(t, nx.t - TRD, nx.t);
    if (nx.tr === 'drop') {
      const dk = seg(t, nx.t - TRD, nx.t - TRD + .35);
      if (dk < 1) drop(g, FR.x + FR.w / 2, FR.y - 40, FR.y + FR.h * .46, dk);
      else rippleReveal(g, gg => drawScene(gg, i + 1, t), FR.x + FR.w / 2, FR.y + FR.h * .46, seg(t, nx.t - TRD + .35, nx.t), t);
