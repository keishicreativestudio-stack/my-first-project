<title>社畜カワウソ 広告動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the 9:16 player beside a timesheet-style scene list; stacks on phones. Single committed office look. */
:root {
  --wall: #e6e9ee;
  --sheet: #f7f8fa;
  --navy: #1f2d4d;
  --ink: #252a33;
  --muted: #6b7382;
  --rule: #cfd5de;
  --note: #ffd84a;
  --hanko: #d63b2f;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --heavy: "Dela Gothic One", "Zen Kaku Gothic New", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { background: var(--wall); color: var(--ink); }
body { font-family: var(--gothic); padding-inline: 16px; padding-block: 24px 48px; line-height: 1.7; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
.screen { width: min(100%, calc(84vh * 9 / 16)); max-width: 100%; aspect-ratio: 9 / 16; background: #111; justify-self: center; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 44px -22px rgba(31, 45, 77, .55); }
.screen canvas { display: block; width: 100%; height: 100%; }
.side { display: grid; gap: 18px; min-width: 0; }
.stamp { display: inline-grid; place-items: center; width: 54px; height: 54px; border: 3px solid var(--hanko); border-radius: 50%; color: var(--hanko); font: 400 15px/1.1 var(--heavy); transform: rotate(-12deg); text-align: center; }
h1 { font: 400 26px/1.35 var(--heavy); margin: 6px 0 4px; color: var(--navy); text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 14px; max-width: 40ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 700 13px var(--gothic); color: var(--navy); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--navy); }
button.primary { background: var(--navy); border-color: var(--navy); color: #fff; min-width: 96px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--note); outline-offset: 2px; }
.tc { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; }
.tc small { color: var(--muted); font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--navy); margin: 0; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
table.ts { width: 100%; border-collapse: collapse; background: var(--sheet); font-size: 13px; }
table.ts th { font: 600 11px var(--mono); letter-spacing: .08em; color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 2px solid var(--navy); }
table.ts td { padding: 0; border-bottom: 1px solid var(--rule); }
table.ts button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 64px 76px 1fr; gap: 8px; padding: 8px 10px; cursor: pointer; }
table.ts button:focus-visible { outline: 2px solid var(--navy); }
table.ts .t { font: 600 12px var(--mono); color: var(--navy); }
table.ts .clock { font: 600 12px var(--mono); color: var(--muted); }
table.ts tr.on td { background: #fff4c2; }
</style>

<div class="wrap">
  <div class="screen"><canvas id="cv" aria-label="社畜カワウソ、今日も生存中 広告動画"></canvas></div>
  <div class="side">
    <div>
      <span class="stamp" aria-hidden="true">生存<br>確認</span>
      <h1>社畜カワウソ、<br>今日も生存中</h1>
      <p class="lede">ドキュメンタリー番組ふうに、社畜カワウソの一日を追う15秒の縦型広告です。朝9時から夜11時まで、体力ゲージが減っていきます。</p>
    </div>
    <div class="row">
      <button class="primary" id="play">▶ 再生</button>
      <button id="snd" aria-pressed="true">🔊 音あり</button>
      <button id="prev">‹ 1コマ</button>
      <button id="next">1コマ ›</button>
      <label class="chk"><input type="checkbox" id="loop" checked> くり返す</label>
    </div>
    <div class="row"><span class="tc" id="tc">0.00</span></div>
    <input type="range" id="seek" min="0" max="15" step="0.001" value="0" aria-label="再生位置">
    <table class="ts"><thead><tr><th>秒</th></tr></thead><tbody id="ts"></tbody></table>
  </div>
</div>

<!--AUDIO-->
<script>
/* ================= utilities ================= */
const DUR = 15, FPS = 30, LW = 540, LH = 960;
const BPM = 96, BEAT = 60 / BPM, BAR = BEAT * 4;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inCubic: k => k * k * k,
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outBack: k => { const c = 2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const frameOf = t => Math.floor(t * FPS + 1e-6);
const $ = id => document.getElementById(id);

/* ================= look ================= */
const C = { wall: '#e6e9ee', sheet: '#f7f8fa', navy: '#1f2d4d', ink: '#252a33', muted: '#6b7382', rule: '#cfd5de', note: '#ffd84a', hanko: '#d63b2f', green: '#35b36b', amber: '#f0a020', night: '#141b2e', night2: '#1f2a44', white: '#ffffff' };
const gf = (w, px) => `${w} ${px}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;
const hv = px => `400 ${px}px "Dela Gothic One", "Zen Kaku Gothic New", sans-serif`;
const mono = (w, px) => `${w} ${px}px "IBM Plex Mono", ui-monospace, monospace`;

/* ================= stickers (static, given life by pop, squash and sway) ================= */
const IMGS = /*IMGS*/{};
const SPR = {};
function loadSprites() {
  return Promise.all(Object.entries(IMGS).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = () => { SPR[k] = im; res(); }; im.onerror = res; im.src = src; })));
}
function sticker(g, k, cx, cy, w, t, t0, opt = {}) {
  const im = SPR[k]; if (!im) return;
  const u = t - t0, land = seg(u, 0, .22);
  /* stamp landing: drops from slightly big, squashes, settles; then a slow tired sway */
  const sc = u < 0 ? 0 : land < 1 ? lerp(1.35, 1, E.inCubic(land)) : 1 + .06 * Math.exp(-(u - .22) * 14) * Math.sin((u - .22) * 40);
  const sq = land >= 1 ? 1 - .08 * Math.exp(-(u - .22) * 16) : 1;
  const sway = (opt.sway ?? 1) * .035 * Math.sin(u * 2.2 + (opt.phase || 0));
  g.save(); g.translate(cx, cy); g.rotate(sway + (opt.rot || 0)); g.scale(sc / sq, sc * sq);
  g.globalAlpha *= clamp(land * 4);
  g.drawImage(im, -w / 2, -w / 2, w, w); g.restore();
}

/* ================= timeline ================= */
const T0 = { hook: 0, title: BAR, am: BAR * 2, pm: BAR * 3, night: BAR * 4, end: BAR * 5 };
const SCENES = [
  { t: T0.am, clock: 'AM 10:00', hp: [100, 72], ask: 'この資料、今日中にお願い', a: '08', b: '05', sub: ['頼まれると、', '反射で承知する。'] },
  { t: T0.pm, clock: 'PM 6:00', hp: [72, 36], ask: 'ごめん、あと1件だけ…', a: '14', b: '10', sub: ['定時は、', 'ただの時刻である。'], chime: true },
  { t: T0.night, clock: 'PM 11:00', hp: [36, 3], ask: 'まだいる？', a: '01', b: '19', sub: ['それでも、', '彼は生きている。'], night: true },
];
const WIPES = [T0.title, T0.am, T0.pm, T0.night, T0.end];
const WIPE = .22;
const WIPE_LABEL = ['', 'AM 10:00', 'PM 6:00', 'PM 11:00', ''];
const CUES = { bpm: BPM, t0: T0, end: DUR, notify: [], stamp: [], wipes: WIPES, chime: T0.pm + .05, title: [], flat: T0.end + .25, beep: T0.end + .95, cta: T0.end + 1.25 };
function buildCues() {
  CUES.notify = []; CUES.stamp = []; CUES.title = [];
  SCENES.forEach(s => { CUES.notify.push(s.t + BEAT * .3); CUES.stamp.push(s.t + BEAT * 1.25, s.t + BEAT * 2.6); });
  CUES.stamp.unshift(.02);
  CUES.title = [T0.title + .15, T0.title + .55, T0.title + 1.1];
}
buildCues();
window.CUES = CUES;

/* ================= canvases ================= */
const cv = $('cv'), ctx = cv.getContext('2d');
const buf = document.createElement('canvas'), b = buf.getContext('2d');
let S = 1, grains = [];
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.min(Math.round(cv.clientWidth * d), 1080);
  if (!w) return;
  const h = Math.round(w * 16 / 9);
  for (const c of [cv, buf]) { c.width = w; c.height = h; }
  S = w / LW;
  grains = [0, 1, 2].map(k => { const c = document.createElement('canvas'); c.width = c.height = 140; const g = c.getContext('2d'), im = g.createImageData(140, 140); for (let i = 0; i < im.data.length; i += 4) { const v = hash(i * .7 + k * 91) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return c; });
  render(T);
}

/* ================= shared pieces ================= */
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function outlined(g, s, x, y, fill, stroke, lw) { g.lineJoin = 'round'; g.strokeStyle = stroke; g.lineWidth = lw; g.strokeText(s, x, y); g.fillStyle = fill; g.fillText(s, x, y); }
/* documentary subtitle: white type with a soft black edge, two lines, bottom of frame */
function subtitle(g, lines, t0, t) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.font = gf(900, 34);
  lines.forEach((l, i) => {
    const k = seg(t, t0 + i * BEAT * 1.2, t0 + i * BEAT * 1.2 + .18); if (k <= 0) return;
    g.globalAlpha = k; const y = 858 + i * 50 - (lines.length - 1) * 50 + 50;
    g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 8 * S;
    outlined(g, l, 270, y, C.white, 'rgba(0,0,0,.75)', 6);
    g.shadowBlur = 0;
  });
  g.restore();
}
/* camcorder-style corner marks that sell the documentary look */
function docFrame(g, t, label) {
  g.save(); g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 3;
  const m = 26, L = 34;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [LW - m, m, -1, 1], [m, LH - m, 1, -1], [LW - m, LH - m, -1, -1]]) { g.beginPath(); g.moveTo(x, y + sy * L); g.lineTo(x, y); g.lineTo(x + sx * L, y); g.stroke(); }
  g.font = mono(600, 15); g.fillStyle = 'rgba(255,255,255,.9)';
  if (frameOf(t) % 30 < 20) { g.fillStyle = C.hanko; g.beginPath(); g.arc(m + 18, m + 46, 6, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillText(label, m + 32, m + 52);
  g.restore();
}
function hpGauge(g, x, y, hp, t, night) {
  const col = hp > 50 ? C.green : hp > 20 ? C.amber : C.hanko, blink = hp <= 10 && frameOf(t) % 12 < 6;
  g.save(); g.font = gf(900, 16); g.fillStyle = night ? '#c7cfdf' : C.muted; g.fillText('体力', x, y + 14);
  const bx = x + 44, bw = 150, bh = 18;
  rrect(g, bx, y, bw, bh, 4); g.fillStyle = night ? 'rgba(255,255,255,.1)' : '#dde2ea'; g.fill();
  for (let i = 0; i < 10; i++) { if (i * 10 >= hp) break; g.fillStyle = blink ? 'rgba(214,59,47,.35)' : col; g.fillRect(bx + 3 + i * 14.6, y + 3, 12, bh - 6); }
  g.font = mono(600, 18); g.fillStyle = hp <= 10 ? C.hanko : night ? C.white : C.navy; g.fillText(Math.round(hp) + '%', bx + bw + 10, y + 16);
  g.restore();
}
function clockHeader(g, s, t, night) {
  g.save(); g.fillStyle = night ? 'rgba(10,14,26,.6)' : C.navy; g.fillRect(0, 0, LW, 118);
  g.font = mono(600, 40); g.fillStyle = C.white; g.fillText(s, 32, 74);
  g.font = gf(700, 14); g.fillStyle = 'rgba(255,255,255,.6)'; g.fillText('WORK CHAT ・ 営業部', 34, 100);
  g.restore();
}
/* chat: boss bubbles on the left, sticker replies on the right, newest at the bottom */
function chat(g, msgs, t, night) {
  const BOTTOM = 760, GAP = 14, SW = 258;
  const vis = msgs.filter(m => m.t <= t), hs = vis.map(m => m.who === 'boss' ? 66 : SW);
  vis.forEach((m, i) => {
    let off = 0; for (let j = i + 1; j < vis.length; j++) off += (hs[j] + GAP) * E.outCubic(seg(t, vis[j].t, vis[j].t + .2));
    const yb = BOTTOM - off, h = hs[i];
    if (m.who === 'boss') {
      const k = seg(t, m.t, m.t + .25);
      g.save(); g.globalAlpha = clamp(k * 3);
      g.fillStyle = night ? '#46506a' : '#c9d0dc'; g.beginPath(); g.arc(58, yb - 30, 24, 0, 7); g.fill();
      g.fillStyle = night ? '#9aa6c0' : '#7c889c'; g.beginPath(); g.arc(58, yb - 36, 8, 0, 7); g.fill(); g.beginPath(); g.ellipse(58, yb - 17, 13, 8, 0, Math.PI, 0); g.fill();
      g.font = gf(700, 13); g.fillStyle = night ? '#9aa6c0' : C.muted; g.fillText('上司', 92, yb - h - 6);
      g.font = gf(700, 25); const w = g.measureText(m.text).width + 40, sc = lerp(.6, 1, E.outBack(k));
      g.translate(92, yb); g.scale(sc, sc); g.translate(-92, -yb);
      rrect(g, 92, yb - h + 6, w, h - 6, 16); g.fillStyle = night ? '#2b3656' : C.white; g.fill();
      g.fillStyle = night ? '#e6eaf2' : C.ink; g.textBaseline = 'middle'; g.fillText(m.text, 112, yb - h / 2 + 4);
      g.restore();
    } else {
      sticker(g, m.st, LW - 30 - SW / 2, yb - SW / 2, SW, t, m.t, { phase: i });
      /* read receipt */
      if (t > m.t + .3) { g.save(); g.font = gf(700, 12); g.fillStyle = night ? '#7f8aa6' : C.muted; g.textAlign = 'right'; g.fillText('既読', LW - 30 - SW - 4, yb - 8); g.restore(); }
    }
  });
}

/* ================= scenes ================= */
function officeBg(g, night, t) {
  const gr = g.createLinearGradient(0, 0, 0, LH);
  if (night) { gr.addColorStop(0, C.night); gr.addColorStop(1, C.night2); } else { gr.addColorStop(0, '#eef1f5'); gr.addColorStop(1, '#dde2e9'); }
  g.fillStyle = gr; g.fillRect(0, 0, LW, LH);
  /* ceiling light panels */
  for (let i = 0; i < 3; i++) {
    const on = night ? (i === 1 ? .6 + .4 * (hash(frameOf(t) * 3.7) > .12 ? 1 : 0) : .08) : 1;
    g.fillStyle = `rgba(255,255,255,${.55 * on})`; g.fillRect(40 + i * 170, 128, 120, 10);
  }
}
function sceneHook(g, t) {
  officeBg(g, false, t);
  /* morning: the otter commutes across a wide shot */
  g.fillStyle = 'rgba(31,45,77,.08)'; for (let i = 0; i < 9; i++) g.fillRect(20 + i * 60, 250, 40, 380);
  g.fillStyle = '#c9ced8'; g.fillRect(0, 640, LW, 6);
  const x = lerp(330, 250, t / BAR);
  /* speed lines */
  g.save(); g.strokeStyle = 'rgba(31,45,77,.35)'; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) { const y = 380 + i * 42, l = 60 + hash(i) * 60, o = ((t * 600 + i * 70) % 200); g.lineWidth = 4; g.beginPath(); g.moveTo(x + 150 + o, y); g.lineTo(x + 150 + o + l, y); g.stroke(); }
  g.restore();
  sticker(g, '12', x, 470, 330, t, -1, { sway: .6 });
  /* clock ticks over from 8:59 to 9:00 */
  g.save(); g.font = mono(600, 56); g.textAlign = 'center'; g.fillStyle = C.navy; g.fillText(t < BEAT * 2 ? '08:59' : '09:00', 270, 190); g.restore();
  subtitle(g, ['野生の社畜カワウソは、', '今日も出社する。'], -.2, t);
  docFrame(g, t, 'REC  DAY 1,284');
}
function sceneTitle(g, t) {
  const u = t - T0.title;
  g.fillStyle = C.note; g.fillRect(0, 0, LW, LH);
  /* ruled memo lines */
  g.strokeStyle = 'rgba(31,45,77,.12)'; g.lineWidth = 2; for (let y = 60; y < LH; y += 48) { g.beginPath(); g.moveTo(0, y); g.lineTo(LW, y); g.stroke(); }
  sticker(g, '15', 270, 300, 300, t, T0.title + .05);
  g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const k1 = seg(t, CUES.title[0], CUES.title[0] + .2), k2 = seg(t, CUES.title[1], CUES.title[1] + .2);
  if (k1 > 0) { g.save(); g.translate(270, 540); const s = lerp(1.6, 1, E.inCubic(k1)); g.scale(s, s); g.globalAlpha = clamp(k1 * 3); g.font = hv(56); outlined(g, '社畜カワウソ、', 0, 0, C.navy, C.white, 12); g.restore(); }
  if (k2 > 0) { g.save(); g.translate(270, 628); const s = lerp(1.6, 1, E.inCubic(k2)); g.scale(s, s); g.globalAlpha = clamp(k2 * 3); g.font = hv(62); outlined(g, '今日も生存中', 0, 0, C.navy, C.white, 12); g.restore(); }
  /* red 生存 hanko slams onto the corner of the title */
  const k3 = seg(t, CUES.title[2], CUES.title[2] + .16);
  if (k3 > 0) hanko(g, 452, 118, 58, ['生存', '確認'], k3);
  const lk = E.outBack(seg(u, 1.4, 1.7));
  if (lk > 0) { g.translate(270, 720); g.scale(lk, lk); g.font = gf(900, 22); const w = g.measureText('LINEスタンプ').width + 48; rrect(g, -w / 2, -24, w, 48, 24); g.fillStyle = C.navy; g.fill(); g.fillStyle = C.white; g.textBaseline = 'middle'; g.fillText('LINEスタンプ', 0, 1); }
  g.restore();
}
function hanko(g, x, y, r, lines, k) {
  g.save(); g.translate(x, y); g.rotate(-.22); const s = lerp(2.2, 1, E.inCubic(k)); g.scale(s, s); g.globalAlpha = clamp(k * 2) * .92;
  g.strokeStyle = C.hanko; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, r, 0, 7); g.stroke(); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, r - 8, 0, 7); g.stroke();
  g.fillStyle = C.hanko; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = hv(r * .42);
  lines.forEach((l, i) => g.fillText(l, 0, (i - (lines.length - 1) / 2) * r * .5));
  /* ink gaps */
  g.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 18; i++) { g.beginPath(); g.arc((hash(i * 3) - .5) * r * 2, (hash(i * 7) - .5) * r * 2, 1 + hash(i) * 2.5, 0, 7); g.fill(); }
  g.restore();
}
function sceneWork(g, i, t) {
  const s = SCENES[i], u = t - s.t, night = !!s.night;
  officeBg(g, night, t);
  clockHeader(g, s.clock, t, night);
  hpGauge(g, 300, 50, lerp(s.hp[0], s.hp[1], E.inOutCubic(seg(u, BEAT, BAR - .2))), t, night);
  if (s.chime) { const k = seg(u, .05, 1.1); if (k > 0 && k < 1) { g.save(); g.globalAlpha = Math.sin(Math.PI * k); g.font = gf(900, 18); g.fillStyle = C.navy; rrect(g, 330, 132, 180, 36, 18); g.fillStyle = C.note; g.fill(); g.fillStyle = C.navy; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♪ 定時です', 420, 151); g.restore(); } }
  chat(g, [{ t: CUES.notify[i], who: 'boss', text: s.ask }, { t: CUES.stamp[1 + i * 2], who: 'me', st: s.a }, { t: CUES.stamp[2 + i * 2], who: 'me', st: s.b }], t, night);
  subtitle(g, s.sub, s.t + BEAT * .6, t);
  if (night) { g.fillStyle = `rgba(20,27,46,${.12 + .1 * (hash(frameOf(t) * 1.3) > .85 ? 1 : 0)})`; g.fillRect(0, 0, LW, LH); }
}
const WALL = ['02', '03', '04', '06', '09', '11', '13', '17', '18', '20', '05', '08'];
function sceneEnd(g, t) {
  const u = t - T0.end;
  g.fillStyle = C.wall; g.fillRect(0, 0, LW, LH);
  /* a wall of the other stickers, drifting up slowly behind the card */
  g.save(); g.globalAlpha = .22;
  for (let i = 0; i < 24; i++) { const q = i % 4, r = Math.floor(i / 4), y = r * 150 - (u * 30) % 150 + 20; const im = SPR[WALL[i % WALL.length]]; if (im) g.drawImage(im, 12 + q * 132, y, 120, 120); }
  g.restore();
  g.fillStyle = 'rgba(230,233,238,.55)'; g.fillRect(0, 0, LW, LH);
  /* heart monitor: flat for a breath, then one beat */
  const mx = 40, mw = 460, my = 170;

function scene(g, t) {

/* ================= transport + sound ================= */
const BOARD = [[T0.hook, 'AM 9:00', '出社（今向かってます）'], [T0.title, '—', 'タイトル・生存確認の判'], [T0.am, 'AM 10:00', '承知しました・すぐやります'], [T0.pm, 'PM 6:00', '定時。帰りたい…・了解です'], [T0.night, 'PM 11:00', '今日も残業・たすけて…'], [T0.end, 'PM 11:59', '心電図がピッ。今日も生存中']];
