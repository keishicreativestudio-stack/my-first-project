type: tips
episode: 8
hook: "家を買う前に\n*1分*でできる\n大事なこと"
sub: "やらずに買うのは危険です"
points:
  - title: "ハザードマップ"
    body: "*洪水・土砂災害・高潮*\nなどのリスクが\n地図でわかる"
  - title: "説明も義務に"
    body: "2020年8月から\n重要事項説明で\n*水害リスクの説明*が義務化"
  - title: "調べ方"
    body: "国土交通省の\n*ハザードマップポータル*で\n住所を入れるだけ"
conclusion: "気になる物件は\n*まず住所で検索*"
caption: |
  家探しの前にハザードマップを見るクセをつけましょう。
  国交省の「ハザードマップポータルサイト」で住所検索するだけです🗾
hashtags: [ハザードマップ, 家探し, 土地探し, マイホーム, 不動産, 家を買う前に]
