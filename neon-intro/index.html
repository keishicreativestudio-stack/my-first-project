<title>Neon Logo Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
<style>
/* Layout: one 16:9 stage (the video), controls below it. Single committed dark look. */
:root {
  --ink: #04060d;        /* stage black, slightly blue */
  --panel: #0c1120;
  --line: #1f2a44;
  --glow: #3d8bff;       /* backlight blue */
  --glow-soft: #9cc4ff;
  --text: #eef3ff;
  --muted: #8a97b4;
  --display: "Quicksand", "M PLUS Rounded 1c", system-ui, sans-serif;
  --jp: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--ink); color: var(--text); }
body { font-family: var(--jp); padding-inline: 16px; padding-block: 20px 32px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }

/* ---------- stage ---------- */
.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
  background: var(--ink); overflow: hidden; border-radius: 6px;
  container-type: inline-size;
}
.stage * { position: absolute; }
canvas.fx { inset: 0; width: 100%; height: 100%; }

/* glitch opener */
.glitch { inset: -6%; background: #e9edf5; display: grid; place-items: center; opacity: 0; }
.glitch .g { position: relative; font-family: var(--display); font-weight: 700; font-size: 9cqw; color: #fff;
  letter-spacing: .02em; text-shadow: -.6cqw 0 #ff3b6b, .6cqw 0 #2bd2ff; filter: blur(.25cqw); }
.glitch .bar { left: 0; right: 0; height: .5cqw; background: #fff; box-shadow: 0 0 2cqw #fff; }
.s-glitch .glitch { opacity: 1; animation: jitter .09s steps(2) infinite; }
@keyframes jitter { 50% { transform: translate(-1cqw, .3cqw) skewX(-8deg); } }

/* character */
.hero { left: 14%; bottom: 13%; width: 30%; height: 72%; opacity: 0; transform: translateY(3cqw) scale(.96);
  transition: opacity 1.2s ease, transform 1.6s cubic-bezier(.2,.8,.2,1); }
.halo { left: 50%; top: 45%; width: 110%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(circle, rgba(61,139,255,.95) 0%, rgba(61,139,255,.45) 30%, rgba(61,139,255,0) 68%);
  filter: blur(1.2cqw); opacity: 0; transition: opacity 1.5s ease .3s; }
.floor { left: -10%; right: -10%; bottom: -1.5cqw; height: 3cqw; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(156,196,255,.9), rgba(61,139,255,0) 70%); filter: blur(.6cqw); }
.hero img, .hero svg { left: 0; right: 0; bottom: 0; margin: auto; max-height: 100%; max-width: 100%; }
.hero img { filter: brightness(0) drop-shadow(0 0 .35cqw var(--glow-soft)) drop-shadow(0 0 1.2cqw var(--glow)); }
.hero svg { width: 100%; height: 100%; filter: drop-shadow(0 0 .35cqw var(--glow-soft)) drop-shadow(0 0 1.2cqw var(--glow)); }
.brackets { inset: -4% -8%; opacity: 0; }
.brackets i { width: 3cqw; height: 3cqw; border: .18cqw solid var(--glow-soft); }
.brackets i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.brackets i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
.brackets i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
.brackets i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
.s-char .hero { opacity: 1; transform: none; }
.s-char .halo { opacity: 1; }
.s-scan .brackets { animation: scan 1.4s ease forwards; }
@keyframes scan { 0% { opacity: 0; transform: scale(1.15); } 25% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }

/* logo block */
.logo { left: 50%; top: 50%; translate: -50% -50%; display: grid; gap: 1.2cqw; opacity: 0;
  transition: left 1.4s cubic-bezier(.65,0,.35,1), opacity .5s ease; white-space: nowrap; }
.stage .logo * { position: relative; }
.eyebrow { font-family: var(--display); font-weight: 500; font-size: 1.05cqw; letter-spacing: .35em; color: var(--muted); }
.word { font-family: var(--display); font-size: 7cqw; line-height: 1; letter-spacing: .01em; }
.word b { font-weight: 700; color: #fff; text-shadow: 0 0 .6cqw #fff, 0 0 2cqw var(--glow), 0 0 4cqw var(--glow); }
.word span { font-weight: 300; color: var(--glow-soft); text-shadow: 0 0 .8cqw var(--glow), 0 0 2.5cqw var(--glow); }
.rule { height: .12cqw; background: linear-gradient(90deg, transparent, var(--glow-soft), transparent); transform: scaleX(0); transition: transform 1s ease .3s; }
.tag { font-size: 2.1cqw; font-weight: 700; color: var(--text); opacity: 0; transform: translateY(1cqw);
  transition: opacity .8s ease, transform .8s ease; }
.s-logo .logo { opacity: 1; animation: flicker 1s linear; }
.s-logo .rule { transform: scaleX(1); }
.s-right .logo { left: 68%; }
.s-tag .tag { opacity: 1; transform: none; }
@keyframes flicker { 0%,12%,22% { opacity: 0 } 8%,18%,30%,100% { opacity: 1 } }

/* flash burst when tagline lands */
.burst { inset: 0; background: radial-gradient(circle at 29% 45%, rgba(156,196,255,.55), transparent 45%); opacity: 0; }
.s-burst .burst { animation: burst 1.2s ease-out; }
@keyframes burst { 0% { opacity: 0 } 15% { opacity: 1 } 100% { opacity: 0 } }

.scene1 { inset: 0; transition: opacity .7s ease; }
.s-out .scene1 { opacity: 0; }

/* closing prompt */
.prompt { left: 50%; top: 50%; translate: -50% -50%; width: 44%; height: 5.4cqw; border-radius: 3cqw;
  border: .1cqw solid var(--line); background: rgba(12,17,32,.85); box-shadow: 0 0 3cqw rgba(61,139,255,.18);
  opacity: 0; transform: scale(.94); transition: opacity .6s ease, transform .6s ease; }
.prompt .t { left: 3cqw; top: 50%; translate: 0 -50%; font-size: 1.9cqw; font-weight: 700; color: var(--text); white-space: nowrap; }
.prompt .t::after { content: ""; display: inline-block; width: .15cqw; height: 2.1cqw; margin-left: .2cqw; vertical-align: -.3cqw;
  background: var(--glow-soft); animation: blink .9s steps(1) infinite; }
.prompt .send { right: .9cqw; top: 50%; translate: 0 -50%; width: 3.6cqw; height: 3.6cqw; border-radius: 50%;
  background: var(--glow); display: grid; place-items: center; box-shadow: 0 0 1.5cqw var(--glow); }
.prompt .send::before { content: ""; position: static; width: 1cqw; height: 1cqw; border-left: .3cqw solid #fff; border-top: .3cqw solid #fff;
  transform: translateY(.3cqw) rotate(45deg); }
.s-prompt .prompt { opacity: 1; transform: none; }
@keyframes blink { 50% { opacity: 0 } }

@media (prefers-reduced-motion: reduce) {
  .s-glitch .glitch, .s-logo .logo { animation: none; }
}

/* ---------- controls ---------- */
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .file { font: 700 14px var(--jp); color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 18px; cursor: pointer; }
button.primary { background: var(--glow); border-color: var(--glow); color: #fff; }
button:focus-visible, .file:focus-within, input:focus-visible { outline: 2px solid var(--glow-soft); outline-offset: 2px; }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.note { color: var(--muted); font-size: 13px; line-height: 1.7; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 6px; font-size: 12px; color: var(--muted); letter-spacing: .08em; min-width: 0; }
label.f input { font: 400 15px var(--jp); color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; min-width: 0; }
h1 { font: 700 18px var(--display); margin: 0; letter-spacing: .02em; }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas class="fx" id="fx"></canvas>
    <div class="scene1">
      <div class="burst"></div>
      <div class="hero">
        <div class="halo"></div>
        <div class="floor"></div>
        <svg id="sil" viewBox="0 0 200 300" aria-hidden="true">
          <!-- placeholder silhouette: chibi figure with a small dog -->
          <g fill="#05070e">
            <ellipse cx="80" cy="74" rx="48" ry="46"/>
            <path d="M30 78 q-6-30 10-48 q-4-14 8-10 q6-18 22-12 q14-14 28-2 q16-6 20 10 q14 2 12 16 q14 10 6 30 q-4 18-10 22 q2-20-8-30 q-10 8-26 2 q-14 8-30 0 q-12 6-20 18 q-8-2-12 4z"/>
            <path d="M56 116 h48 q14 4 16 22 l4 64 q0 8-8 8 h-10 l-2 72 q0 6-6 6 h-10 l-2-68 h-4 l-2 68 h-10 q-6 0-6-6 l-2-72 h-10 q-8 0-8-8 l4-64 q2-18 16-22z"/>
            <path d="M120 300 q-6-40 8-62 q-2-18 6-30 l8 12 q10-2 18 0 l8-12 q8 12 6 30 q16 22 8 62z"/>
          </g>
        </svg>
        <img id="charImg" alt="" hidden>
        <div class="brackets"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="logo">
        <div class="eyebrow" id="oEyebrow">CREATIVE STUDIO</div>
        <div class="word"><b id="oBold">keishi</b> <span id="oLight">studio</span></div>
        <div class="rule"></div>
        <div class="tag" id="oTag">つくるを、もっと身近に。</div>
      </div>
    </div>
    <div class="glitch"><div class="bar" style="top:38%"></div><div class="g" id="oGlitch">keishi studio</div><div class="bar" style="top:64%;width:30%;left:60%"></div></div>
    <div class="prompt"><div class="t" id="typed"></div><div class="send"></div></div>
  </div>

  <div class="bar">
    <button class="primary" id="play">▶ 最初から再生</button>
    <label class="file">キャラ画像を差し替え<input type="file" id="file" accept="image/*"></label>
    <span class="note">背景を透過したPNG（ChatGPTで作ったキャラなど）を選ぶと、青く光るシルエットになります。</span>
  </div>

  <h1>テキストを編集</h1>
  <div class="fields">
    <label class="f">小見出し<input id="iEyebrow" value="CREATIVE STUDIO"></label>
    <label class="f">ロゴ（太字）<input id="iBold" value="keishi"></label>
    <label class="f">ロゴ（細字）<input id="iLight" value="studio"></label>
    <label class="f">キャッチコピー<input id="iTag" value="つくるを、もっと身近に。"></label>
    <label class="f">最後に打ち込む文字<input id="iPrompt" value="AIで、つくってみよう"></label>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
let timers = [];

function bind(input, out, extra) {
  $(input).addEventListener('input', e => { $(out).textContent = e.target.value; extra && extra(); });
}
const syncGlitch = () => $('oGlitch').textContent = $('iBold').value + ' ' + $('iLight').value;
bind('iEyebrow', 'oEyebrow'); bind('iTag', 'oTag');
bind('iBold', 'oBold', syncGlitch); bind('iLight', 'oLight', syncGlitch);

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { $('charImg').src = r.result; $('charImg').hidden = false; $('sil').style.display = 'none'; play(); };
  r.readAsDataURL(f);
});

/* timeline: [ms, classes to set] */
const cues = [
  [0,    ['s-glitch']],
  [1100, ['s-logo']],
  [3000, ['s-logo', 's-right', 's-char', 's-scan']],
  [5000, ['s-logo', 's-right', 's-char', 's-tag', 's-burst']],
  [7300, ['s-logo', 's-right', 's-char', 's-tag', 's-out']],
  [8100, ['s-out', 's-prompt']],
];
const ALL = ['s-glitch','s-logo','s-right','s-char','s-scan','s-tag','s-burst','s-out','s-prompt'];

function play() {
  timers.forEach(clearTimeout); timers = [];
  stage.classList.remove(...ALL); $('typed').textContent = '';
  void stage.offsetWidth;
  cues.forEach(([t, cls]) => timers.push(setTimeout(() => { stage.classList.remove(...ALL); stage.classList.add(...cls); }, t)));
  const text = $('iPrompt').value;
  [...text].forEach((ch, i) => timers.push(setTimeout(() => $('typed').textContent += ch, 8800 + i * 110)));
}
$('play').addEventListener('click', play);

/* ambient particles + light rays */
const cv = $('fx'), ctx = cv.getContext('2d');
let W, H, dots = [];
function size() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = stage.clientWidth * d; H = cv.height = stage.clientHeight * d;
  dots = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 * d + .3, v: Math.random() * .25 + .05, a: Math.random() }));
}
new ResizeObserver(size).observe(stage); size();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t) {
  ctx.clearRect(0, 0, W, H);
  if (stage.classList.contains('s-logo') && !stage.classList.contains('s-right')) {
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(t / 9000);
    for (let i = 0; i < 18; i++) {
      ctx.rotate(Math.PI * 2 / 18);
      const g = ctx.createLinearGradient(0, 0, W * .6, 0);
      g.addColorStop(0, 'rgba(61,139,255,.16)'); g.addColorStop(1, 'rgba(61,139,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * .6, -W * .012); ctx.lineTo(W * .6, W * .012); ctx.fill();
    }
    ctx.restore();
  }
  for (const p of dots) {
    if (!still) { p.y -= p.v; if (p.y < 0) { p.y = H; p.x = Math.random() * W; } }
    ctx.fillStyle = `rgba(190,215,255,${.25 + .5 * Math.abs(Math.sin(t / 900 + p.a * 6))})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* rest on the logo frame so the thumbnail shows the finished look, then play */
stage.classList.add('s-logo', 's-right', 's-char', 's-tag');
setTimeout(play, 1200);
</script>
