type: tips
episode: 4
hook: "相場より\n*安すぎる家*には\n理由がある"
sub: "「再建築不可」って知ってますか？"
points:
  - title: "接道義務"
    body: "家を建てる土地は\n幅4m以上の道路に\n*2m以上*接する必要あり"
  - title: "満たさないと…"
    body: "今の家を壊したら\n*建て替えできない*\nローンも通りにくい"
  - title: "見分け方"
    body: "販売図面の\n*「再建築不可」*の表記と\n道路との接し方をチェック"
conclusion: "安さの理由は\n*必ず*確認しよう"
caption: |
  相場より安い家には理由があることも。
  代表例が「再建築不可」物件です。買う前に必ず確認を！
hashtags: [再建築不可, 家探し, 中古戸建, 不動産, 住宅購入, 家を買う前に]
