<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-old-mincho.css">
<style>
/* E案：静かな明朝体（1280×670） */
:root{--ink:#2e302f;--sub:#8b8e8c}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;font-family:"Zen Old Mincho",serif;color:var(--ink);position:relative;overflow:hidden;
  background:
   radial-gradient(ellipse 60% 90% at 78% 8%, rgba(255,250,236,.95), rgba(255,250,236,0) 70%),
   linear-gradient(115deg,#e9ebe8 0%,#f4f4f1 45%,#ecedea 100%)}
/* 窓から差す光の影 */
.light{position:absolute;inset:-100px;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(120,125,120,.07) 120px 128px,transparent 128px 260px);filter:blur(10px)}
.main{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:40px}
h1{font-size:52px;font-weight:500;letter-spacing:.2em;line-height:1.9;text-align:center}
.series{font-size:19px;font-weight:500;letter-spacing:.32em;color:var(--sub)}
</style></head><body>
<div class="light"></div>
<div class="main">
  <h1>フォロワーがいなくても、<br>売れるのか。</h1>
  <div class="series">AIチャレンジ365 ― Day 10</div>
</div>
</body></html>
