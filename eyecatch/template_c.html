<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-maru-gothic.css">
<style>
/* C案：ステッカー型（1280×670） */
:root{--bg:#fdf1c7;--ink:#2b2a26;--sub:#8b8570;--accent:#f06e8c}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.series{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:22px;font-weight:700;letter-spacing:.16em;color:var(--sub)}
.series b{color:var(--ink);margin-left:.4em}
.card{position:absolute;left:50%;top:54%;width:700px;height:390px;transform:translate(-50%,-50%) rotate(-2.5deg);background:#fff;border-radius:48px;border:7px solid var(--ink);box-shadow:14px 14px 0 var(--ink);display:grid;place-items:center;align-content:center;gap:22px}
.face{display:flex;gap:44px;height:30px;position:relative;width:120px;justify-content:center}
.face i{width:16px;height:16px;border-radius:50%;background:var(--ink)}
.face s{position:absolute;top:22px;width:40px;height:20px;border:6px solid var(--ink);border-top:none;border-radius:0 0 24px 24px}
.face b{position:absolute;top:14px;width:22px;height:12px;border-radius:50%;background:var(--accent);opacity:.55}
.face b:nth-of-type(1){left:-26px}.face b:nth-of-type(2){right:-26px}
h1{font-size:64px;font-weight:900;line-height:1.3;text-align:center;letter-spacing:.03em}
h1 em{font-style:normal;color:var(--accent)}
p{font-size:24px;font-weight:700;color:var(--sub);letter-spacing:.08em}
</style></head><body>
<div class="series">AIチャレンジ365<b>Day 10</b></div>
<div class="card">
  <div class="face"><i></i><i></i><s></s><b></b><b></b></div>
  <h1>フォロワーなしでも<br><em>売れる？</em></h1>
  <p>人気LINEスタンプの共通点</p>
</div>
</body></html>
