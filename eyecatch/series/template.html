<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/zen-kaku-gothic-new.css"><link rel="stylesheet" href="../fonts/zen-old-mincho.css">
<style>
/* AIチャレンジ365 シリーズ見出し画像（J-1：生成り×紺、1280×670） */
:root{--bg:#f5f1e8;--ink:#1f2f4d;--sub:#7b8193;--accent:#1f2f4d;--line:#e2b44a}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.frame{position:absolute;inset:28px;border:2px solid var(--ink)}
.mast{position:absolute;top:28px;left:28px;right:28px;height:78px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.mast .name{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:34px;letter-spacing:.12em}
.mast .no{font-size:20px;font-weight:900;letter-spacing:.2em}
.mast .no b{font-size:32px;margin-left:6px}
.main{position:absolute;top:106px;bottom:84px;left:28px;right:28px;display:grid;place-items:center;align-content:center;gap:26px}
.kicker{font-size:22px;font-weight:900;letter-spacing:.3em;color:var(--sub)}
h1{font-size:70px;font-weight:900;line-height:1.4;text-align:center;letter-spacing:.02em}
h1 u{text-decoration:none;background:linear-gradient(transparent 80%,var(--line) 80% 94%,transparent 94%)}
.foot{position:absolute;bottom:28px;left:28px;right:28px;height:56px;border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:40px;font-size:18px;font-weight:500;letter-spacing:.18em;color:var(--sub)}
</style></head><body>
<div class="frame"></div>
<div class="mast"><span class="name">AIチャレンジ365</span><span class="no">No.<b>{{no}}</b></span></div>
<div class="main">
  <div class="kicker">{{kicker}}</div>
  <h1>{{title}}</h1>
</div>
<div class="foot">{{foot}}</div>
</body></html>
