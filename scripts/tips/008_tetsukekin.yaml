type: tips
episode: 9
hook: "契約の日に\n*まとまった現金*が\nいるって知ってた？"
sub: "「手付金」の話"
points:
  - title: "手付金とは"
    body: "売買契約のときに払うお金\n目安は*物件価格の5〜10%*"
  - title: "現金で準備"
    body: "原則*現金*で用意\n最終的には\n代金の一部に充てられる"
  - title: "足りないときは"
    body: "金額は*話し合いで*\n決まることも\n担当者に早めに相談を"
conclusion: "頭金ゼロでも\n*手付金*は準備しておこう"
caption: |
  フルローンでも、契約時に「手付金」が必要になるケースが多いです。
  早めに準備しておくと安心です💰
hashtags: [手付金, 住宅ローン, 家探し, マイホーム, 不動産, 家を買う前に]
