<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/zen-kaku-gothic-new.css"><link rel="stylesheet" href="fonts/zen-old-mincho.css">
<style>
/* J-2：文芸誌風（1280×670） */
:root{--bg:#fbfaf6;--ink:#20251f;--sub:#7a8075;--accent:#2f6b4f}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Old Mincho",serif;color:var(--ink);position:relative;overflow:hidden}
.frame{position:absolute;inset:28px;border:1px solid var(--ink)}
.frame2{position:absolute;inset:36px;border:1px solid var(--ink)}
.mast{position:absolute;top:36px;left:36px;right:36px;height:84px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.mast .name{font-weight:700;font-size:34px;letter-spacing:.16em}
.mast .no{font-family:"Zen Kaku Gothic New",sans-serif;font-size:18px;font-weight:500;letter-spacing:.2em;color:var(--sub)}
.mast .no b{font-family:"Zen Old Mincho",serif;font-size:30px;color:var(--accent);font-weight:700;margin:0 16px 0 4px}
.main{position:absolute;top:120px;bottom:92px;left:36px;right:36px;display:grid;place-items:center;align-content:center;gap:28px}
.kicker{font-family:"Zen Kaku Gothic New",sans-serif;font-size:20px;font-weight:500;letter-spacing:.34em;color:var(--accent);display:flex;align-items:center;gap:18px}
.kicker::before,.kicker::after{content:"";width:40px;height:1px;background:var(--accent)}
h1{font-size:68px;font-weight:700;line-height:1.45;text-align:center;letter-spacing:.06em}
.foot{position:absolute;bottom:36px;left:36px;right:36px;height:56px;border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:36px;font-size:18px;letter-spacing:.2em;color:var(--sub)}
</style></head><body>
<div class="frame"></div><div class="frame2"></div>
<div class="mast"><span class="name">AIチャレンジ365</span><span class="no">vol.<b>10</b>2026年9月</span></div>
<div class="main">
  <div class="kicker">特集　LINEスタンプ</div>
  <h1>フォロワーがいなくても、<br>スタンプは売れるのか</h1>
</div>
<div class="foot"><span>人気スタンプの共通点を調べてみた</span></div>
</body></html>
