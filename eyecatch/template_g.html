<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/dela-gothic-one.css"><link rel="stylesheet" href="fonts/zen-kaku-gothic-new.css">
<style>
/* G案：大きな数字（1280×670） */
:root{--bg:#ffd23f;--ink:#1d1d1b}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:670px;background:var(--bg);font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);position:relative;overflow:hidden}
.zero{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-family:"Dela Gothic One",sans-serif;font-size:560px;line-height:1;color:#fff;opacity:.55}
.main{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:22px}
.small{font-size:34px;font-weight:900;letter-spacing:.2em}
h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:92px;line-height:1.2;letter-spacing:.02em;text-align:center}
.series{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;letter-spacing:.28em}
</style></head><body>
<div class="zero">0</div>
<div class="main">
  <div class="small">フォロワー0人でも</div>
  <h1>スタンプは<br>売れる？</h1>
</div>
<div class="series">AIチャレンジ365 / DAY 10</div>
</body></html>
